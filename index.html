<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <title>Calculator</title>
</head>

<body>
    <main>
        <div class="display"></div>

        <div class="actions">
            <button data-action="clear">C</button>
            <button data-action="del" aria-label="Delete">⌫</button>
            <button data-action="equal">=</button>
        </div>
        <div class="keys">

            <div class="numbers">
                <button data-number="1">1</button>
                <button data-number="2">2</button>
                <button data-number="3">3</button>
                <button data-number="4">4</button>
                <button data-number="5">5</button>
                <button data-number="6">6</button>
                <button data-number="7">7</button>
                <button data-number="8">8</button>
                <button data-number="9">9</button>
                <button data-number="0">0</button>
                <button data-number=".">.</button>
            </div>
            <div class="operators">
                <button data-operator="add">+</button>
                <button data-operator="sub">-</button>
                <button data-operator="mult">×</button>
                <button data-operator="div">÷</button>
            </div>
        </div>

    </main>

    <script src="calculator.js"></script>
</body>

</html>
