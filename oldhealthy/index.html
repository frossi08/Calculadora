<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<title>OldHealthy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0E7C72">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column (max 480px), screens swapped by JS; inner screens get a teal header band, main tabs get a bottom nav. */
:root {
  --bg: #EAF2F8;
  --bg-top: #DAE8F4;
  --surface: #FFFFFF;
  --surface-2: #F4F8FA;
  --ink: #18227A;
  --text: #1E2A33;
  --muted: #5A6A76;
  --line: #D3E3E7;
  --teal: #0E7C72;
  --teal-strong: #0E7C72;
  --teal-2: #4DB6AC;
  --teal-soft: #E2F1EF;
  --teal-tint: #E6F3F1;
  --sos: #D32F2F;
  --sos-soft: #FBE3E3;
  --gear: #1E7FE0;
  --ok: #2E7D32;
  --ok-soft: #E3F0E4;
  --lilac: #A98BDF;
  --lilac-soft: #F2EDFB;
  --warn: #EF7D16;
  --sun-soft: #FFF5D9;
  --sun: #F2B01E;
  --shadow: 0 6px 22px rgba(24, 50, 90, .08);
  --on-teal: #FFFFFF;
  --font-display: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r-lg: 28px;
  --r-md: 20px;
  --r-sm: 14px;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --app-h: 100vh;
  --edge: max(0px, calc((100vw - 480px) / 2));
  --stage: #C9DCE6;
  --hs: 1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C181E; --bg-top: #102530; --surface: #14232A; --surface-2: #192C34;
    --ink: #CBD8FF; --text: #E5EDF1; --muted: #9DB0BA; --line: #27414B;
    --teal: #5CC8BB; --teal-strong: #0F6E65; --teal-2: #3FA79B; --teal-soft: #1A3B3C; --teal-tint: #173337;
    --sos: #E5484D; --sos-soft: #3A1E22; --gear: #3B8FEA; --ok: #5DBB63; --ok-soft: #1D3324;
    --lilac: #B9A0EC; --lilac-soft: #2A2440; --warn: #F59A45; --sun-soft: #3A321A; --sun: #F5C24A;
    --shadow: 0 6px 22px rgba(0,0,0,.35); color-scheme: dark;
  }
}
:root[data-theme="dark"], :root[data-oh-theme="dark"] {
  --bg: #0C181E; --bg-top: #102530; --surface: #14232A; --surface-2: #192C34;
  --ink: #CBD8FF; --text: #E5EDF1; --muted: #9DB0BA; --line: #27414B;
  --teal: #5CC8BB; --teal-strong: #0F6E65; --teal-2: #3FA79B; --teal-soft: #1A3B3C; --teal-tint: #173337;
  --sos: #E5484D; --sos-soft: #3A1E22; --gear: #3B8FEA; --ok: #5DBB63; --ok-soft: #1D3324;
  --lilac: #B9A0EC; --lilac-soft: #2A2440; --warn: #F59A45; --sun-soft: #3A321A; --sun: #F5C24A;
  --shadow: 0 6px 22px rgba(0,0,0,.35); color-scheme: dark;
}
:root[data-oh-theme="light"] {
  --bg: #EAF2F8; --bg-top: #DAE8F4; --surface: #FFFFFF; --surface-2: #F4F8FA;
  --ink: #18227A; --text: #1E2A33; --muted: #5A6A76; --line: #D3E3E7;
  --teal: #0E7C72; --teal-strong: #0E7C72; --teal-2: #4DB6AC; --teal-soft: #E2F1EF; --teal-tint: #E6F3F1;
  --sos: #D32F2F; --sos-soft: #FBE3E3; --gear: #1E7FE0; --ok: #2E7D32; --ok-soft: #E3F0E4;
  --lilac: #A98BDF; --lilac-soft: #F2EDFB; --warn: #EF7D16; --sun-soft: #FFF5D9; --sun: #F2B01E;
  --shadow: 0 6px 22px rgba(24, 50, 90, .08); color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--font-body); font-size: 1rem; line-height: 1.45;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 3px solid var(--gear); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); color: var(--ink); margin: 0; text-wrap: balance; }
p { margin: 0; }
svg { display: block; }
.ico { width: 1.5rem; height: 1.5rem; flex: none; }

#shell {
  max-width: 480px; margin: 0 auto; min-height: 100%;
  background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg) 40%, var(--bg) 100%);
  position: relative; overflow-x: hidden;
}
.screen { min-height: var(--app-h); display: flex; flex-direction: column; }
.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.with-nav { padding-bottom: calc(96px + var(--sab)); }

/* Floating settings gear (present on every screen, like the original) */
.gear {
  position: fixed; z-index: 40;
  top: calc(14px + var(--sat));
  right: max(16px, calc((100vw - 480px) / 2 + 16px), env(safe-area-inset-right, 0px));
  width: 58px; height: 58px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #4FA3F5, var(--gear) 60%);
  color: #fff; display: grid; place-items: center;
  box-shadow: 0 6px 18px rgba(30,127,224,.45), 0 0 0 4px rgba(30,127,224,.18);
}
.gear svg { width: 30px; height: 30px; }

/* Welcome */
.logo-tile {
  width: 74px; height: 74px; border-radius: 22px; background: var(--surface);
  display: grid; place-items: center; color: var(--teal-2); box-shadow: var(--shadow);
}
.logo-tile svg { width: 36px; height: 36px; }
.welcome-top { padding-top: calc(28px + var(--sat)); }
.hero { display: grid; grid-template-columns: minmax(0, 1fr) 40%; align-items: center; gap: 8px; margin-top: 40px; }
.hero h1 { font-size: calc(2.35rem * var(--hs)); line-height: 1.12; font-weight: 800; letter-spacing: -.01em; }
.hero p { margin-top: 18px; font-size: 1.08rem; color: var(--text); max-width: 30ch; }
.hero-img { width: calc(100% + 16px); max-width: none; margin-right: -16px; align-self: center; aspect-ratio: 434 / 615; object-fit: contain; }
.cta {
  margin-top: 30px; display: inline-flex; align-items: center; gap: 16px;
  padding: 10px 10px 10px 30px; border-radius: 999px; color: #fff;
  background: linear-gradient(90deg, #4DB6AC, #0E7C72);
  font-family: var(--font-display); font-weight: 800; font-size: 1.3rem;
  box-shadow: 0 10px 22px rgba(14,124,114,.28);
}
.cta .round { width: 52px; height: 52px; border-radius: 50%; background: #fff; color: #0E7C72; display: grid; place-items: center; }
.daily-card {
  margin: 44px 0 32px; padding: 26px 22px 30px; border-radius: 34px;
  background: color-mix(in srgb, var(--surface) 82%, transparent); box-shadow: var(--shadow);
}
.daily-card .row { display: flex; justify-content: space-between; align-items: center; }
.daily-card h2 { font-size: calc(1.45rem * var(--hs)); font-weight: 700; }
.plus-btn { color: var(--teal-2); width: 44px; height: 44px; display: grid; place-items: center; }
.plus-btn svg { width: 34px; height: 34px; }
.tiles3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 22px; }
.tile3 { display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 1.1rem; color: var(--text); }
.tile3 .box { width: 100%; max-width: 104px; aspect-ratio: 1; border-radius: 24px; background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; color: var(--teal); }
.tile3 .box svg { width: 40px; height: 40px; }

/* Auth */
.auth-bg {
  height: 300px; position: relative; overflow: hidden;
  background:
    radial-gradient(circle at 18% 30%, rgba(255,255,255,.55) 0 3px, transparent 4px),
    radial-gradient(circle at 70% 48%, rgba(255,255,255,.7) 0 4px, transparent 6px),
    radial-gradient(circle at 46% 62%, rgba(255,255,255,.5) 0 5px, transparent 7px),
    radial-gradient(circle at 84% 22%, rgba(190,255,245,.6) 0 6px, transparent 9px),
    radial-gradient(circle at 30% 80%, rgba(255,255,255,.45) 0 3px, transparent 5px),
    radial-gradient(circle at 60% 15%, rgba(140,230,220,.55) 0 10px, transparent 16px),
    radial-gradient(circle at 10% 60%, rgba(140,230,220,.35) 0 14px, transparent 22px),
    radial-gradient(ellipse at 50% 50%, #3E9AA0 0%, #2B7A86 45%, #1E5966 100%);
}
.auth-bg::after {
  content: ""; position: absolute; inset: -20% -10%;
  background: linear-gradient(160deg, transparent 35%, rgba(200,255,250,.35) 48%, rgba(255,255,255,.15) 52%, transparent 62%);
}
.auth-tabs { position: absolute; z-index: 2; left: 0; right: 0; top: 110px; display: flex; justify-content: space-around; }
.auth-tabs button { font-family: var(--font-display); font-weight: 800; letter-spacing: .06em; font-size: calc(1.45rem * var(--hs)); color: rgba(255,255,255,.62); }
.auth-tabs button[aria-selected="true"] { color: #fff; }
.auth-sheet { background: var(--surface); border-radius: 44px 44px 0 0; margin-top: -60px; position: relative; z-index: 3; padding-top: 34px; padding-bottom: 40px; flex: 1; }
.auth-sheet h1 { color: var(--teal); text-align: center; font-size: calc(1.85rem * var(--hs)); font-weight: 800; margin-bottom: 26px; }
.field { position: relative; margin-top: 22px; }
.field label { position: absolute; left: 24px; top: -11px; padding: 0 8px; background: var(--surface); color: var(--teal); font-size: .95rem; }
.field input, .field select, .field textarea {
  width: 100%; border: 2px solid color-mix(in srgb, var(--teal-2) 45%, transparent); border-radius: 999px;
  padding: 18px 24px; font-size: 1.15rem; background: var(--surface); color: var(--text);
}
.field textarea { border-radius: 22px; resize: vertical; min-height: 84px; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--teal); }
.field .eye { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); color: var(--muted); padding: 6px; }
.hint { text-align: right; font-style: italic; color: var(--muted); font-size: .92rem; margin-top: 16px; }
.btn-primary {
  width: 100%; margin-top: 26px; padding: 18px; border-radius: 999px; background: var(--teal-2); color: #fff;
  font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; letter-spacing: .18em;
  box-shadow: 0 12px 24px rgba(77,182,172,.3);
}
.btn-primary:disabled { opacity: .5; box-shadow: none; cursor: not-allowed; }
.btn-primary.plain { letter-spacing: .02em; }
.divider { display: flex; align-items: center; gap: 16px; color: var(--muted); margin: 28px 0 22px; font-size: 1.05rem; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.btn-google { width: 100%; padding: 16px; border-radius: 999px; border: 2px solid color-mix(in srgb, var(--teal-2) 40%, transparent); display: flex; justify-content: center; align-items: center; gap: 14px; font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; color: var(--ink); }
.err { color: var(--sos); margin-top: 14px; font-weight: 600; min-height: 1.4em; }

/* Home */
.brand { display: flex; align-items: center; gap: 16px; padding-top: calc(24px + var(--sat)); }
.brand .logo-tile { width: 70px; height: 70px; }
.brand h2 { font-size: calc(1.6rem * var(--hs)); font-weight: 800; }
.brand small { color: var(--muted); font-size: 1rem; }
.bell { margin-left: auto; position: relative; width: 70px; height: 70px; border-radius: 22px; background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; color: var(--teal-2); }
.bell svg { width: 32px; height: 32px; }
.badge { position: absolute; top: -8px; right: -6px; min-width: 28px; height: 28px; padding: 0 7px; border-radius: 999px; background: var(--sos); color: #fff; font-weight: 700; font-size: .9rem; display: grid; place-items: center; border: 3px solid var(--surface); font-variant-numeric: tabular-nums; }
.greet { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; margin-top: 36px; }
.greet h1 { font-size: calc(2.4rem * var(--hs)); font-weight: 800; }
.greet p { font-size: 1.12rem; margin-top: 8px; }
.sos-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.sos {
  width: 152px; height: 152px; border-radius: 50%; background: var(--sos); color: #fff;
  font-family: var(--font-display); font-weight: 800; font-size: 2.6rem; letter-spacing: .04em;
  box-shadow: 0 0 0 7px var(--sos-soft), 0 0 0 11px var(--sos), 0 14px 30px rgba(211,47,47,.35);
}
.sos-label { color: var(--sos); font-family: var(--font-display); font-weight: 800; letter-spacing: .14em; font-size: calc(.95rem * var(--hs)); }
.card { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); }
.checkin-card { margin-top: 30px; display: flex; flex-wrap: wrap; align-items: center; gap: 14px 16px; padding: 18px; border: 2px solid color-mix(in srgb, var(--teal-2) 35%, transparent); background: color-mix(in srgb, var(--surface) 70%, transparent); }
.sun-box { width: 74px; height: 74px; border-radius: 20px; background: var(--sun-soft); display: grid; place-items: center; color: var(--sun); flex: none; }
.sun-box svg { width: 42px; height: 42px; }
.checkin-card h3 { font-size: calc(1.3rem * var(--hs)); font-weight: 800; line-height: 1.15; }
.checkin-card p { color: var(--muted); font-size: 1.02rem; }
.checkin-card .grow { flex: 1; min-width: 150px; }
.checkin-card .pill-btn { margin-left: auto; }
.pill-btn { background: var(--teal-2); color: #fff; border-radius: 999px; padding: 14px 20px; font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; display: inline-flex; align-items: center; gap: 10px; white-space: nowrap; }
.today-card { margin-top: 22px; padding: 18px 18px 8px; }
.today-head { display: flex; align-items: center; gap: 16px; width: 100%; text-align: left; }
.sq-ico { width: 56px; height: 56px; border-radius: 16px; background: var(--teal-2); color: #fff; display: grid; place-items: center; flex: none; }
.today-head h3 { font-size: calc(1.4rem * var(--hs)); font-weight: 800; flex: 1; }
.today-head .chev { color: var(--teal); }
.today-item { display: flex; align-items: center; gap: 16px; padding: 18px 6px; }
.today-item + .today-item { border-top: 1px solid var(--line); }
.circ-ico { width: 58px; height: 58px; border-radius: 50%; background: var(--teal-2); color: #fff; display: grid; place-items: center; flex: none; }
.circ-ico.lilac { background: var(--lilac); }
.today-item .grow { flex: 1; min-width: 0; }
.today-item h4 { margin: 0; font-family: var(--font-display); color: var(--ink); font-size: calc(1.2rem * var(--hs)); font-weight: 800; }
.today-item p { font-size: 1.08rem; color: var(--text); }
.done-dot { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--teal-2); color: var(--teal-2); flex: none; }
.done-dot.on { background: var(--teal-2); color: #fff; }
.empty-line { color: var(--muted); padding: 14px 6px 18px; }
.grid4 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 22px; }
.feat { padding: 20px 12px 22px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; }
.feat .big { width: 108px; height: 108px; border-radius: 26px; display: grid; place-items: center; margin-bottom: 10px; background: var(--teal-tint); color: var(--teal-2); }
.feat .big svg { width: 50px; height: 50px; }
.feat .big.lilac { background: var(--lilac-soft); color: var(--lilac); }
.feat .big.teal { color: var(--teal); }
.feat h3 { font-size: calc(1.22rem * var(--hs)); font-weight: 800; }
.feat p { color: var(--muted); font-size: .98rem; }
.help-card { margin-top: 22px; display: flex; align-items: center; gap: 16px; padding: 18px; width: 100%; text-align: left; border: 2px solid color-mix(in srgb, var(--teal-2) 35%, transparent); background: color-mix(in srgb, var(--surface) 70%, transparent); }
.help-card .bubble { width: 70px; height: 70px; border-radius: 50%; background: var(--teal-tint); color: var(--teal-2); display: grid; place-items: center; flex: none; }
.help-card .bubble svg { width: 38px; height: 38px; }
.help-card h3 { font-size: calc(1.28rem * var(--hs)); font-weight: 800; }
.help-card p { color: var(--text); }
.help-card .grow { flex: 1; min-width: 0; }
.promo { display: grid; grid-template-columns: minmax(0, 1fr) 42%; gap: 14px; align-items: center; margin-top: 30px; }
.promo h2 { font-size: calc(1.75rem * var(--hs)); font-weight: 800; line-height: 1.15; }
.promo p { color: var(--muted); margin-top: 8px; }
.promo img { width: 100%; aspect-ratio: 1; object-fit: cover; object-position: top; }

/* Bottom nav */
.nav {
  position: fixed; z-index: 30; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(4, 1fr);
  padding: 10px max(8px, env(safe-area-inset-right, 0px)) calc(10px + var(--sab)) max(8px, env(safe-area-inset-left, 0px));
}
.nav button { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); font-size: 1.02rem; font-weight: 500; padding: 4px 0; }
.nav button svg { width: 34px; height: 34px; }
.nav button[aria-current="page"] { color: var(--teal); font-weight: 700; }

/* Inner screen header */
.head-band {
  background: var(--teal-strong); color: #fff; border-radius: 0 0 30px 30px;
  padding-top: calc(28px + var(--sat)); padding-bottom: 22px;
  display: flex; align-items: center; gap: 16px;
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.head-band .back { width: 58px; height: 58px; border-radius: 50%; background: rgba(255,255,255,.18); color: #fff; display: grid; place-items: center; flex: none; }
.head-band h1 { color: #fff; font-size: calc(1.8rem * var(--hs)); font-weight: 800; }
.head-band p { color: rgba(255,255,255,.85); font-size: 1.02rem; }
.list { display: flex; flex-direction: column; gap: 16px; margin-top: 22px; padding-bottom: 120px; }
.fab {
  position: fixed; z-index: 25; right: calc(var(--edge) + 18px); bottom: calc(24px + var(--sab));
  height: 62px; padding: 0 24px 0 18px; border-radius: 999px; background: var(--teal-strong); color: #fff;
  display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 800; font-size: 1.1rem;
  box-shadow: 0 10px 24px rgba(14,124,114,.38);
}
.fab.raise { bottom: calc(108px + var(--sab)); }

/* Medicamentos */
.med { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 20px 16px; }
.med.taken { background: var(--teal-tint); box-shadow: none; }
.med .t { text-align: center; }
.med .t b { display: block; font-family: var(--font-display); font-weight: 800; font-size: calc(1.75rem * var(--hs)); color: var(--teal); font-variant-numeric: tabular-nums; line-height: 1.1; }
.med.taken .t b { color: var(--teal-2); }
.med .t span { color: var(--muted); font-size: .92rem; }
.med h3 { font-size: calc(1.4rem * var(--hs)); font-weight: 800; }
.med.taken h3 { color: color-mix(in srgb, var(--ink) 65%, var(--lilac)); }
.med .dose { font-size: 1.1rem; }
.med .note { font-style: italic; color: var(--muted); }
.med .actions { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.take { width: 62px; height: 62px; border-radius: 50%; background: var(--teal-2); color: #fff; display: grid; place-items: center; opacity: .8; }
.take.on { background: #5E9E62; opacity: 1; }
.trash { color: #E05252; padding: 6px; }
.allergy { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; color: var(--sos); background: var(--sos-soft); border-radius: 999px; padding: 4px 10px; font-size: .88rem; font-weight: 700; }
.allergy svg { width: 16px; height: 16px; }

/* Consultas */
.appt { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 18px 16px; }
.datebox { background: var(--teal-tint); border-radius: 18px; padding: 12px 14px; text-align: center; min-width: 118px; }
.datebox small { display: block; color: var(--teal); font-family: var(--font-display); font-weight: 700; font-size: .98rem; font-variant-numeric: tabular-nums; }
.datebox b { font-family: var(--font-display); font-weight: 800; font-size: calc(1.75rem * var(--hs)); color: var(--ink); font-variant-numeric: tabular-nums; }
.appt h3 { font-size: calc(1.3rem * var(--hs)); font-weight: 800; overflow-wrap: anywhere; }
.appt p { font-size: 1.05rem; }
.appt .place { display: flex; gap: 6px; color: var(--muted); align-items: flex-start; margin-top: 4px; }
.appt .place svg { width: 18px; height: 18px; color: var(--teal); margin-top: 3px; }
.appt.past { opacity: .6; }
.sec-title { font-family: var(--font-display); color: var(--muted); font-weight: 700; font-size: .95rem; letter-spacing: .08em; text-transform: uppercase; margin-top: 10px; }

/* Lembretes */
.rem { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 16px; }
.alarm { width: 92px; height: 92px; border-radius: 22px; background: var(--teal-2); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
.alarm b { font-family: var(--font-display); font-weight: 800; font-size: calc(1.25rem * var(--hs)); font-variant-numeric: tabular-nums; }
.rem.off .alarm { background: var(--line); color: var(--muted); }
.rem h3 { font-size: calc(1.3rem * var(--hs)); font-weight: 800; overflow-wrap: anywhere; }
.rem p { color: var(--muted); }
.rem .side { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.switch { width: 74px; height: 40px; border-radius: 999px; background: #C9CFD3; border: 3px solid #C9CFD3; position: relative; transition: background .2s; flex: none; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 30px; height: 30px; border-radius: 50%; background: #fff; transition: transform .2s; }
.switch[aria-checked="true"] { background: var(--teal-strong); border-color: var(--teal-strong); }
.switch[aria-checked="true"]::after { transform: translateX(34px); }

/* Bem-estar */
.seg { display: flex; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
.seg button { padding: 12px 22px; border-radius: 999px; border: 2px solid color-mix(in srgb, var(--teal-2) 40%, transparent); font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; color: var(--ink); background: var(--surface); }
.seg button[aria-pressed="true"] { background: var(--teal-strong); color: #fff; border-color: var(--teal-strong); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 20px; }
.stat { padding: 20px; }
.stat .ic { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; margin-bottom: 14px; }
.stat b { display: block; font-family: var(--font-display); font-weight: 800; font-size: calc(1.75rem * var(--hs)); color: var(--ink); font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); }
.chart-card { margin-top: 20px; padding: 22px 20px; }
.chart-card h3 { font-size: calc(1.4rem * var(--hs)); font-weight: 800; }
.chart-card > p { color: var(--muted); }
.bars { display: flex; align-items: flex-end; gap: 6px; height: 190px; margin-top: 24px; }
.bars .col { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 8px; }
.bars .bar { width: 100%; max-width: 42px; border-radius: 999px; }
.bars .dash { width: 70%; max-width: 30px; height: 8px; border-radius: 999px; background: var(--line); }
.bars .lbl { font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; height: 1.2em; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 16px; font-size: 1rem; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
.pain { display: grid; gap: 8px; margin-top: 20px; }
.pain div { height: 40px; border-radius: 10px; background: var(--line); }
.pain div.on { background: var(--sos); }
.pain-note { margin-top: 14px; font-weight: 600; }

/* Check-in */
.moods { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 16px; }
.mood { border: 2px solid var(--line); border-radius: 20px; background: var(--surface); padding: 16px 4px 12px; display: flex; flex-direction: column; align-items: center; gap: 10px; font-weight: 600; font-size: 1.02rem; }
.mood svg { width: 54px; height: 54px; }
.mood[aria-pressed="true"] { border-color: var(--teal); background: var(--teal-tint); box-shadow: 0 0 0 2px var(--teal); }
.qrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 20px 22px; margin-top: 14px; font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; color: var(--text); }

/* Chat */
.chat-head { display: flex; align-items: center; gap: 16px; padding-top: calc(26px + var(--sat)); padding-bottom: 16px; border-bottom: 1px solid var(--line); background: var(--surface); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.chat-head .av { width: 62px; height: 62px; border-radius: 50%; background: var(--teal-strong); color: #fff; display: grid; place-items: center; flex: none; }
.chat-head h1 { font-size: calc(1.45rem * var(--hs)); font-weight: 800; }
.chat-head p { color: var(--muted); font-size: .98rem; }
.chat-wrap { display: flex; flex-direction: column; height: var(--app-h); padding-bottom: calc(96px + var(--sab)); }
.msgs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding-top: 18px; padding-bottom: 18px; background: var(--surface-2); }
.msg { max-width: 86%; padding: 14px 18px; border-radius: 24px; font-size: 1.15rem; line-height: 1.5; overflow-wrap: anywhere; }
.msg.me { align-self: flex-end; background: var(--teal-strong); color: #fff; border-bottom-right-radius: 8px; }
.msg.ai { align-self: flex-start; background: var(--surface); border: 1.5px solid color-mix(in srgb, var(--teal-2) 35%, transparent); border-bottom-left-radius: 8px; }
.msg.ai p + p, .msg.ai p + ul, .msg.ai ul + p, .msg.ai p + ol, .msg.ai ol + p { margin-top: 10px; }
.msg.ai ul, .msg.ai ol { margin: 0; padding-left: 1.2em; }
.msg.ai li + li { margin-top: 4px; }
.msg .meta { display: block; font-size: .8rem; color: var(--muted); margin-top: 8px; }
.msg.err-msg { border-color: var(--sos); }
.typing { display: inline-flex; gap: 6px; padding: 6px 0; }
.typing i { width: 9px; height: 9px; border-radius: 50%; background: var(--teal-2); animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.chips { display: flex; gap: 10px; overflow-x: auto; padding-top: 12px; padding-bottom: 12px; background: var(--surface-2); scrollbar-width: none; }
.chips button { white-space: nowrap; padding: 12px 18px; border-radius: 999px; background: var(--teal-tint); border: 1.5px solid color-mix(in srgb, var(--teal-2) 40%, transparent); color: var(--teal); font-family: var(--font-display); font-weight: 700; font-size: 1.02rem; }
.composer { display: flex; gap: 12px; align-items: center; padding-top: 12px; padding-bottom: 12px; background: var(--surface); border-top: 1px solid var(--line); }
.composer input { flex: 1; min-width: 0; border: 2px solid color-mix(in srgb, var(--teal-2) 40%, transparent); border-radius: 999px; padding: 16px 22px; font-size: 1.15rem; background: var(--surface); }
.composer input:focus { outline: none; border-color: var(--teal); }
.send { width: 62px; height: 62px; border-radius: 50%; background: var(--teal-2); color: #fff; display: grid; place-items: center; flex: none; }
.send:disabled { opacity: .5; }
.ai-mode { display: inline-flex; align-items: center; gap: 6px; font-size: .85rem; color: var(--muted); }
.ai-mode i { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); }
.ai-mode.on i { background: var(--ok); }

/* Perfil */
.profile-band { background: var(--teal-strong); color: #fff; border-radius: 0 0 40px 40px; text-align: center; padding-top: calc(26px + var(--sat)); padding-bottom: 30px; }
.avatar { width: 150px; height: 150px; margin: 0 auto; border-radius: 50%; background: var(--teal-2); border: 5px solid #fff; display: grid; place-items: center; color: #fff; }
.avatar svg { width: 80px; height: 80px; }
.profile-band h1 { color: #fff; font-size: calc(2rem * var(--hs)); margin-top: 14px; }
.profile-band p { color: rgba(255,255,255,.82); font-size: 1.15rem; }
.info-card { margin-top: 22px; padding: 22px; }
.info-card h2 { font-size: calc(1.3rem * var(--hs)); font-weight: 800; padding-bottom: 14px; border-bottom: 1.5px solid var(--line); }
.info-row { display: flex; gap: 16px; align-items: center; padding: 16px 0; }
.info-row + .info-row { border-top: 1.5px solid var(--line); }
.info-row .ic { width: 58px; height: 58px; border-radius: 16px; background: var(--teal-tint); color: var(--teal); display: grid; place-items: center; flex: none; }
.info-row small { display: block; color: var(--muted); font-size: .98rem; }
.info-row b { font-size: 1.3rem; font-weight: 600; overflow-wrap: anywhere; }
.call-btn { width: 100%; margin-top: 8px; padding: 18px; border-radius: 999px; background: var(--teal-strong); color: #fff; display: flex; justify-content: center; align-items: center; gap: 12px; font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; text-decoration: none; }
.edit-btn { width: 100%; margin-top: 22px; margin-bottom: 20px; padding: 18px; border-radius: 999px; background: var(--teal-2); color: #fff; display: flex; justify-content: center; align-items: center; gap: 12px; font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; }

/* Agenda */
.days { display: flex; gap: 10px; overflow-x: auto; margin-top: 20px; padding-bottom: 6px; scrollbar-width: none; }
.days button { flex: none; width: 64px; padding: 12px 0; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; color: var(--muted); }
.days button b { font-family: var(--font-display); font-size: calc(1.4rem * var(--hs)); color: var(--ink); font-variant-numeric: tabular-nums; }
.days button[aria-pressed="true"] { background: var(--teal-strong); color: #fff; }
.days button[aria-pressed="true"] b { color: #fff; }
.tl { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; }
.tl-item { display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px 16px; }
.tl-item .when { font-family: var(--font-display); font-weight: 800; font-size: calc(1.25rem * var(--hs)); color: var(--teal); font-variant-numeric: tabular-nums; }
.tl-item h4 { margin: 0; font-family: var(--font-display); color: var(--ink); font-size: calc(1.12rem * var(--hs)); }
.tl-item p { color: var(--muted); font-size: .98rem; }
.tag { font-size: .8rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--teal-tint); color: var(--teal); white-space: nowrap; }
.tag.lilac { background: var(--lilac-soft); color: var(--lilac); }
.tag.blue { background: color-mix(in srgb, var(--gear) 15%, transparent); color: var(--gear); }
.page-title { padding-top: calc(30px + var(--sat)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page-title h1 { font-size: calc(2rem * var(--hs)); font-weight: 800; }
.page-title p { color: var(--muted); }

/* Sheets, toasts, banners */
.overlay { position: fixed; inset: 0; z-index: 60; background: rgba(8, 20, 30, .5); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 480px; max-height: calc(var(--app-h) * .92); overflow-y: auto; background: var(--surface); border-radius: 30px 30px 0 0; padding-top: 22px; padding-bottom: calc(26px + var(--sab)); }
.sheet .grab { width: 54px; height: 6px; border-radius: 999px; background: var(--line); margin: 0 auto 16px; }
.sheet h2 { font-size: calc(1.5rem * var(--hs)); font-weight: 800; }
.sheet .sub { color: var(--muted); margin-top: 4px; }
.sheet .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.btn-ghost { width: 100%; margin-top: 12px; padding: 16px; border-radius: 999px; border: 2px solid var(--line); font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; color: var(--ink); }
.btn-danger { width: 100%; margin-top: 12px; padding: 16px; border-radius: 999px; background: var(--sos); color: #fff; font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; }
.set-group { margin-top: 22px; }
.set-group > b { display: block; font-family: var(--font-display); color: var(--ink); font-size: 1.1rem; margin-bottom: 10px; }
.opts { display: flex; gap: 10px; flex-wrap: wrap; }
.opts button { flex: 1 1 0; min-width: max-content; padding: 14px 12px; font-size: .95rem; border-radius: 16px; border: 2px solid var(--line); font-weight: 700; color: var(--ink); background: var(--surface); }
.opts button[aria-pressed="true"] { border-color: var(--teal); background: var(--teal-tint); color: var(--teal); }
.set-note { color: var(--muted); font-size: .95rem; margin-top: 8px; }
.toast { position: fixed; z-index: 80; left: 50%; transform: translateX(-50%); top: calc(90px + var(--sat)); background: var(--ink); color: var(--surface); padding: 14px 22px; border-radius: 999px; font-weight: 600; box-shadow: var(--shadow); max-width: calc(100% - 32px); text-align: center; }
.alert-banner { position: fixed; z-index: 70; top: calc(12px + var(--sat)); left: 50%; transform: translateX(-50%); width: calc(100% - 32px); max-width: 448px; background: var(--surface); border: 3px solid var(--teal-2); border-radius: 24px; padding: 16px; display: flex; gap: 14px; align-items: center; box-shadow: 0 16px 40px rgba(0,0,0,.25); }
.alert-banner .grow { flex: 1; min-width: 0; }
.alert-banner h4 { margin: 0; font-family: var(--font-display); color: var(--ink); font-size: calc(1.15rem * var(--hs)); }
.sos-sheet { text-align: center; }
.sos-count { width: 150px; height: 150px; margin: 18px auto; border-radius: 50%; background: var(--sos); color: #fff; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: calc(3.6rem * var(--hs)); box-shadow: 0 0 0 10px var(--sos-soft); }
.num-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; padding: 14px 16px; border-radius: 18px; background: var(--surface-2); margin-top: 10px; text-align: left; }
.num-row .grow { flex: 1 1 150px; min-width: 0; }
.num-row small { display: block; color: var(--muted); font-size: .9rem; }
.num-row b { display: block; font-size: 1.25rem; font-variant-numeric: tabular-nums; white-space: nowrap; user-select: all; }
.num-actions { display: flex; gap: 8px; margin-left: auto; }
.num-row button { display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; border-radius: 999px; background: var(--teal-strong); color: #fff; font-weight: 700; }
.num-row button .ico { width: 1.1rem; height: 1.1rem; }
.num-row.red [data-act="call"] { background: var(--sos); }
.num-row .copy { background: var(--surface); color: var(--ink); border: 2px solid var(--line); }

/* Tela de ligação (simulação realista) */
.call-screen {
  position: fixed; inset: 0; z-index: 120; display: flex; flex-direction: column; align-items: center; text-align: center; color: #fff;
  padding: calc(var(--sat) + 34px) 24px calc(var(--sab) + 22px);
  background: radial-gradient(120% 70% at 50% 0%, #2f6f6f 0%, #163a3f 45%, #0a171b 100%);
  animation: callIn .35s ease-out;
}
.call-screen.emerg { background: radial-gradient(120% 70% at 50% 0%, #7a2a2a 0%, #3a1416 45%, #120709 100%); }
.call-screen.leaving { animation: callOut .4s ease-in forwards; }
@keyframes callIn { from { opacity: 0; transform: translateY(24px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes callOut { to { opacity: 0; transform: translateY(16px); } }
.call-status { font-size: 1.05rem; color: rgba(255,255,255,.75); min-height: 1.4em; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.call-name { color: #fff; font-size: calc(2rem * var(--hs)); font-weight: 700; margin-top: 6px; }
.call-num { color: rgba(255,255,255,.8); font-size: 1.15rem; margin-top: 4px; font-variant-numeric: tabular-nums; }
.call-sub { color: rgba(255,255,255,.65); font-size: .95rem; margin-top: 2px; min-height: 1.3em; }
.call-mid { flex: 1; display: grid; place-items: center; width: 100%; min-height: 0; }
.call-avatar { position: relative; width: 132px; height: 132px; display: grid; place-items: center; }
.call-avatar .av { position: relative; z-index: 2; width: 132px; height: 132px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(160deg, #6fd0c4, #2a8f86); font-family: var(--font-display); font-weight: 800; font-size: 2.8rem; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.call-screen.emerg .call-avatar .av { background: linear-gradient(160deg, #ff7a7a, #c62828); }
.call-avatar .av svg { width: 64px; height: 64px; }
.call-avatar .ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(255,255,255,.55); animation: ring 2.4s ease-out infinite; }
.call-avatar .ring:nth-child(2) { animation-delay: .8s; }
.call-avatar .ring:nth-child(3) { animation-delay: 1.6s; }
@keyframes ring { from { transform: scale(1); opacity: .7; } to { transform: scale(2.1); opacity: 0; } }
.call-screen.connected .ring { animation: none; opacity: 0; }
.call-screen.connected .call-avatar .av { animation: talk 1.6s ease-in-out infinite; }
@keyframes talk { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,.25), 0 10px 30px rgba(0,0,0,.35); } 50% { box-shadow: 0 0 0 14px rgba(255,255,255,0), 0 10px 30px rgba(0,0,0,.35); } }
.call-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px 26px; margin-bottom: 26px; }
.call-actions button { display: flex; flex-direction: column; align-items: center; gap: 8px; color: #fff; font-size: .9rem; }
.call-actions .cb { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.16); backdrop-filter: blur(6px); transition: background .15s, color .15s; }
.call-actions .cb svg { width: 30px; height: 30px; }
.call-actions button[aria-pressed="true"] .cb { background: #fff; color: #0f2a2e; }
.end-call { width: 78px; height: 78px; border-radius: 50%; background: #E53935; color: #fff; display: grid; place-items: center; box-shadow: 0 10px 26px rgba(229,57,53,.45); }
.end-call svg { width: 36px; height: 36px; transform: rotate(135deg); }
.end-call:active { transform: scale(.94); }
.call-note { margin-top: 14px; font-size: .78rem; color: rgba(255,255,255,.5); }
.keypad { width: 100%; display: flex; flex-direction: column; align-items: center; }
.keypad .typed { font-size: 1.8rem; min-height: 1.4em; letter-spacing: .1em; font-variant-numeric: tabular-nums; }
.keys { display: grid; grid-template-columns: repeat(3, 72px); gap: 14px 24px; margin-top: 8px; }
.key { width: 72px; height: 72px; border-radius: 50%; background: rgba(255,255,255,.16); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
.key b { font-size: 1.8rem; font-weight: 500; font-family: var(--font-body); }
.key small { font-size: .62rem; letter-spacing: .14em; opacity: .7; margin-top: 2px; min-height: .8em; }
.key:active { background: rgba(255,255,255,.4); }
.call-screen.kp .call-actions, .call-screen.kp .call-sub { display: none; }
.call-screen.kp .call-mid { align-items: end; padding-bottom: 22px; }
.call-bottom { position: relative; width: 100%; display: flex; justify-content: center; }
.kp-hide { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); color: #fff; font-size: 1.05rem; font-weight: 600; padding: 10px; }
.notif-item { display: flex; gap: 14px; align-items: center; padding: 14px 0; }
.notif-item + .notif-item { border-top: 1px solid var(--line); }
.google-acc { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 18px; border: 2px solid var(--line); width: 100%; text-align: left; margin-top: 12px; }
.google-acc .av { width: 46px; height: 46px; border-radius: 50%; background: var(--lilac); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 1.2rem; }

/* Moldura de celular (computador / apresentação) */
#statusbar, #homebar { display: none; }
html.phone-mode { --sat: 52px; --sab: 20px; --app-h: 844px; --edge: 0px; }
html.phone-mode, html.phone-mode body { height: 100%; overflow: hidden; }
html.phone-mode body { background: radial-gradient(circle at 25% 15%, var(--bg-top), var(--stage) 70%); }
html.phone-mode #stage { position: fixed; inset: 0; display: grid; place-items: center; }
html.phone-mode #phone {
  position: relative; flex: none; box-sizing: content-box; width: 390px; height: 844px;
  border: 13px solid #101317; border-radius: 60px; overflow: hidden; background: var(--bg);
  box-shadow: 0 0 0 2px #454b52, 0 0 0 5px #1b1f24, 0 40px 90px rgba(10, 30, 50, .4);
  transform: scale(var(--ps, 1));
}
html.phone-mode #scroller { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
html.phone-mode #scroller::-webkit-scrollbar { display: none; }
html.phone-mode #shell { min-height: 100%; }
html.phone-mode #statusbar {
  display: flex; position: absolute; z-index: 130; top: 0; left: 0; right: 0; height: 52px;
  padding: 16px 32px 0 40px; justify-content: space-between; align-items: center;
  font: 600 16px/1 var(--font-body); color: var(--text); pointer-events: none; font-variant-numeric: tabular-nums;
}
html.phone-mode #statusbar.light { color: #fff; }
html.phone-mode #statusbar.in-call, html.phone-mode #statusbar.in-call.solid { background: transparent; box-shadow: none; }
html.phone-mode #statusbar.solid { background: var(--bg); box-shadow: 0 1px 0 var(--line); }
html.phone-mode #statusbar.light.solid { background: var(--teal-strong); box-shadow: none; }
html.phone-mode #statusbar.chat.solid, html.phone-mode #statusbar.chat { background: var(--surface); }
#statusbar .island { position: absolute; left: 50%; top: 11px; transform: translateX(-50%); width: 120px; height: 34px; border-radius: 20px; background: #000; }
#statusbar .sb-right { display: flex; align-items: center; gap: 6px; }
#statusbar svg { width: auto; height: 13px; }
html.phone-mode #homebar { display: block; position: absolute; z-index: 130; bottom: 8px; left: 50%; transform: translateX(-50%); width: 136px; height: 5px; border-radius: 3px; background: var(--text); opacity: .75; pointer-events: none; }

/* Anotações */
.quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 20px; }
.quick button { background: var(--surface); box-shadow: var(--shadow); border-radius: 20px; padding: 14px 4px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-weight: 700; font-size: .95rem; color: var(--ink); }
.quick .qi { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; }
.last3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
.last3 .card { padding: 14px 12px; }
.last3 small { color: var(--muted); display: block; }
.last3 b { display: block; font-family: var(--font-display); font-weight: 800; font-size: calc(1.3rem * var(--hs)); color: var(--ink); font-variant-numeric: tabular-nums; margin: 4px 0 6px; }
.lvl { display: inline-block; font-size: .78rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
.lvl.ok { background: var(--ok-soft); color: var(--ok); }
.lvl.att { background: var(--sun-soft); color: #9A6A00; }
.lvl.high { background: var(--sos-soft); color: var(--sos); }
.lvl.low { background: color-mix(in srgb, var(--gear) 15%, transparent); color: var(--gear); }
.note-item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 16px; }
.note-item .ni { width: 50px; height: 50px; border-radius: 16px; display: grid; place-items: center; }
.note-item h4 { margin: 0; font-family: var(--font-display); color: var(--ink); font-size: calc(1.12rem * var(--hs)); }
.note-item p { color: var(--muted); font-size: .95rem; overflow-wrap: anywhere; }
.note-item .txt { color: var(--text); font-size: 1.05rem; white-space: pre-wrap; }
.day-label { font-family: var(--font-display); color: var(--muted); font-weight: 700; font-size: .92rem; letter-spacing: .06em; text-transform: uppercase; margin-top: 8px; }
.wide-card { margin-top: 16px; display: flex; align-items: center; gap: 16px; padding: 18px; width: 100%; text-align: left; }
.wide-card .big { width: 70px; height: 70px; border-radius: 20px; background: var(--sun-soft); color: #C98A00; display: grid; place-items: center; flex: none; }
.wide-card .big svg { width: 36px; height: 36px; }
.wide-card h3 { font-size: calc(1.22rem * var(--hs)); font-weight: 800; }
.wide-card p { color: var(--muted); }
.wide-card .grow { flex: 1; min-width: 0; }
.editable { cursor: pointer; border-radius: 12px; }
.list-hint { color: var(--muted); font-size: .95rem; text-align: center; }
.data-counts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0 4px; }
.data-counts div { background: var(--surface-2); border-radius: 14px; padding: 10px 6px; text-align: center; }
.data-counts b { display: block; font-family: var(--font-display); font-size: 1.3rem; color: var(--ink); }
.data-counts span { font-size: .85rem; color: var(--muted); }
.info-card .set-group:first-of-type { margin-top: 16px; }
.info-card p.body { margin-top: 14px; font-size: 1.05rem; }

@media (max-width: 380px) {

const pad2 = (n) => String(n).padStart(2, "0");
const ymd = (d = new Date()) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;

const parseYmd = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };

function fmtPhone(raw) {
  let d = String(raw || "").replace(/\D/g, "");
  if (d.length > 11 && d.startsWith("55")) d = d.slice(2);
  if (d.length === 11) return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;
  if (d.length === 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`;
  if (d.length === 9) return `${d.slice(0, 5)}-${d.slice(5)}`;
  return String(raw || "").trim();
}

async function hashPass(p) {
  try {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("oh:" + p));
    return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
  } catch {
    let h = 5381; for (const ch of "oh:" + p) h = ((h << 5) + h + ch.charCodeAt(0)) | 0; return "f" + (h >>> 0).toString(16);
  }
}

const isTaken = (m) => m.takenOn === ymd();
const sortTime = (a, b) => a.time.localeCompare(b.time);
function allergyHit(medName, allergies) {
  const a = norm(allergies).split(/[,;\/]| e /).map((x) => x.trim()).filter((x) => x.length > 2);
  const n = norm(medName);
  return a.some((x) => n.includes(x) || x.includes(n));
}
function pendingToday(u) {
  const hm = nowHM();
  const meds = u.meds.filter((m) => m.freq !== "Se necessário" && !isTaken(m));
  const rems = u.lembretes.filter((r) => r.on && r.time >= hm);
  const soon = u.consultas.filter((c) => { const d = parseYmd(c.date); const diff = (d - parseYmd(ymd())) / 864e5; return diff >= 0 && diff <= 7; });
  return { meds, rems, soon, count: meds.length + rems.length + soon.length };
}

    if (n.sys >= 180 || n.dia >= 110) return ["high", "Muito alta"];
    if (n.sys >= 140 || n.dia >= 90) return ["high", "Alta"];
    if (n.sys < 90 || n.dia < 60) return ["low", "Baixa"];
    if (n.sys >= 130 || n.dia >= 85) return ["att", "Atenção"];
    return ["ok", "Normal"];
  }
  if (n.type === "glicemia") {
    const jejum = n.moment !== "Depois de comer";
    if (n.value < 70) return ["low", "Baixa"];
    if (n.value < (jejum ? 100 : 140)) return ["ok", "Normal"];
    if (n.value < (jejum ? 126 : 200)) return ["att", "Atenção"];
    return ["high", "Alta"];
  }
  return null;
}
const noteValue = (n) => n.type === "pressao" ? `${n.sys}/${n.dia}` : n.type === "glicemia" ? `${n.value}` : n.type === "peso" ? `${String(n.value).replace(".", ",")}` : "";
const sortNotes = (arr) => [...arr].sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
const lastOf = (u, t) => sortNotes((u.notas || []).filter((n) => n.type === t))[0];
const noteIcon = (t) => ({ pressao: I.heart, glicemia: I.drop, peso: I.scale, nota: I.edit }[t]);
function dayName(dstr) {
  const t = ymd(); if (dstr === t) return "Hoje"; if (dstr === ymd(addDays(new Date(), -1))) return "Ontem";
  const d = parseYmd(dstr); return `${WD[d.getDay()]}, ${brDate(dstr)}`;
}

  const strip = Array.from({ length: 14 }, (_, i) => addDays(t, i));
  const items = [];

  for (const r of u.lembretes.filter((r) => r.on)) items.push({ time: r.time, title: r.title, sub: r.desc, tag: "Lembrete", cls: "lilac" });
  for (const c of u.consultas.filter((c) => c.date === sel)) items.push({ time: c.time, title: c.specialty, sub: `${c.doctor}${c.place ? " · " + c.place : ""}`, tag: "Consulta", cls: "blue" });

/* ---------- Cópia de segurança ---------- */
async function exportBackup() {
  const u = me();
  const data = JSON.stringify({ app: "OldHealthy", version: 1, savedAt: new Date().toISOString(), user: u }, null, 2);
  const filename = `oldhealthy-${norm(u.profile.name).split(" ")[0] || "dados"}-${ymd()}.json`;
  if (window.claude && typeof window.claude.use === "function") {
    try {
      const dl = await window.claude.use("downloads");
      if (dl) { await dl.save({ filename, data }); toast("Cópia salva"); return; }
    } catch (e) { if (e && e.code === "declined") return; }
  }
  try {
    const url = URL.createObjectURL(new Blob([data], { type: "application/json" }));
    const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); toast("Cópia salva em Downloads");
  } catch { toast("Não foi possível salvar a cópia neste aparelho"); }
}
let pendingRestore = null;
function onRestoreFile(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result);
      if (!j || j.app !== "OldHealthy" || !j.user || !j.user.email || !j.user.profile) throw new Error("formato");
      pendingRestore = j;
      openSheet(`<h2>Restaurar esta cópia?</h2><p class="sub">Cópia de ${esc(j.user.profile.name)}, salva em ${brDate(String(j.savedAt).slice(0, 10))}. Os dados atuais dessa conta serão trocados por ela.</p>
        <button class="btn-primary plain" data-act="doRestore">Restaurar</button><button class="btn-ghost" data-act="close">Cancelar</button>`);
    } catch { toast("Esse arquivo não é uma cópia do OldHealthy"); }
  };
  r.readAsText(file);
}
function doRestore() {
  const j = pendingRestore; if (!j) return;
  const u = Object.assign({ meds: [], consultas: [], lembretes: [], checkins: {}, chat: [], notas: [] }, j.user);
  DB.users[u.email] = u; DB.session = u.email; save(); pendingRestore = null;
  closeSheet(); S.stack = []; go("perfil", { replace: true }); toast("Dados restaurados");
}

const CHIPS = ["Posso caminhar com pressão alta?", "Como melhorar meu sono?", "O que comer para controlar a diabetes?", "Posso tomar Dorflex junto com Losartana?", "Dicas para não esquecer os remédios"];
function md(text) {
  const lines = esc(text).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").split(/\n/);
  let out = "", list = null, para = [];
  const flushP = () => { if (para.length) { out += `<p>${para.join("<br>")}</p>`; para = []; } };
  const flushL = () => { if (list) { out += `<${list.t}>${list.items.map((i) => `<li>${i}</li>`).join("")}</${list.t}>`; list = null; } };
  for (const raw of lines) {
    const l = raw.trim();
    const ul = l.match(/^[-*•]\s+(.*)/), ol = l.match(/^\d+[.)]\s+(.*)/);
    if (ul || ol) { flushP(); const t = ul ? "ul" : "ol"; if (!list || list.t !== t) { flushL(); list = { t, items: [] }; } list.items.push((ul || ol)[1]); }
    else if (!l) { flushP(); flushL(); }
    else { flushL(); para.push(l.replace(/^#+\s*/, "")); }
  }
  flushP(); flushL();
  return out;
}

const AI = { mode: "checking", sample: null };
async function detectAI() {
  if (window.claude && typeof window.claude.use === "function") {
    try { AI.sample = await window.claude.use("sample"); } catch { AI.sample = null; }
    if (AI.sample) { AI.mode = "claude"; refreshChatMode(); return; }
  }
  if (!/^https?:$/.test(location.protocol)) { AI.mode = "offline"; refreshChatMode(); return; }
  try {
    const r = await fetch("api/health", { cache: "no-store" });
    const j = r.ok ? await r.json() : null;
    AI.mode = j && j.ai ? "server" : (j ? "server-nokey" : "offline");
  } catch { AI.mode = "offline"; }
  refreshChatMode();
}

const KB_RX = KB.map((t) => ({ t, rx: t.k.map((k) => { const n = norm(k).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); return { n, rx: new RegExp(n.length <= 3 ? `(^|[^a-z])${n}([^a-z]|$)` : `(^|[^a-z])${n}`) }; }) }));
function kbAnswer(q) {
  const n = norm(q);
  const hits = [];
  for (const { t, rx } of KB_RX) { let sc = 0; for (const k of rx) if (k.rx.test(n)) sc += k.n.length; if (sc) hits.push([sc, t]); }
  if (!hits.length) return null;
  hits.sort((x, y) => y[0] - x[0]);
  const best = hits[0][1];
  const list = (arr) => arr.map((x) => `- ${x}`).join("\n");
  const f = FACETS.find(([, , rx]) => rx.test(n));
  // Duas condições na mesma pergunta: resposta combinada (45 temas -> 990 pares x 10 tipos)
  const second = hits.slice(1).map((h) => h[1]).find((t) => t !== best && t.c2 && t.t !== best.t);
  if (best.c2 && second) {
    const key = f ? f[0] : "p", label = f ? f[1] : "Como cuidar";
    const cap = (x) => x.t.charAt(0).toUpperCase() + x.t.slice(1);
    const seen = new Set(), items = [];
    for (const it of [...best[key], ...second[key]]) { const k = norm(it).slice(0, 40); if (!seen.has(k)) { seen.add(k); items.push(it); } }
    return `**${cap(best)} + ${second.t}: ${label.toLowerCase()}**\nQuem tem as duas condições deve juntar os cuidados:\n${list(items.slice(0, 7))}\n\n**Procure ajuda se:** ${best.m[0]}; ou ${second.m[0].charAt(0).toLowerCase() + second.m[0].slice(1)}.\n\nComo são duas condições, combine o plano com o seu médico.`;
  }
  const name = best.t.charAt(0).toUpperCase() + best.t.slice(1);
  if (!f) return `**${name}**\n${best.o.join(". ")}.\n\n**Como cuidar:**\n${list(best.p.slice(0, 3))}\n\n**Procure ajuda se:** ${best.m[0]}.`;
  const [key, label] = f;
  const extra = key === "m" ? "" : key === "r" ? "\n\nConfirme sempre com o seu médico antes de mudar qualquer tratamento." : `\n\n**Procure ajuda se:** ${best.m[0]}.`;
  return `**${name}: ${label.toLowerCase()}**\n${list(best[key])}${extra}`;
}

async function askAI(u, onText) {
  if (AI.ready) await AI.ready;
  const turns = u.chat.slice(-20).map((m) => ({ role: m.role, content: m.content }));
  if (AI.mode === "claude" && AI.sample) {
    const r = await AI.sample([{ role: "user", content: RULES(u) }, ...turns], { cache: false, effort: "low", onText: ({ text }) => onText(text) });
    return r.text;
  }
  if (AI.mode === "server") {
    const r = await fetch("api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ messages: turns, context: userContext(u) }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw { code: "server", message: j.error || "Falha no servidor" };
    return j.text;
  }
  const full = offlineAnswer(turns[turns.length - 1].content, u);
  await new Promise((r) => setTimeout(r, 700));
  const words = full.split(/(\s+)/);
  for (let i = 0; i < words.length; i += 4) { onText(words.slice(0, i + 4).join("")); await new Promise((r) => setTimeout(r, 35)); }
  return full;
}

async function sendChat(text) {
  const u = me(); text = text.trim();
  if (!text || S.busy) return;
  S.busy = true;
  u.chat.push({ role: "user", content: text }); save();
  const box = $("#msgs");
  box.insertAdjacentHTML("beforeend", `<div class="msg me">${esc(text)}</div><div class="msg ai" id="pending"><span class="typing"><i></i><i></i><i></i></span></div>`);
  box.scrollTop = box.scrollHeight;
  $("#chatInput").value = ""; $(".send").disabled = true;
  const pend = $("#pending");
  try {
    const answer = await askAI(u, (t) => { pend.innerHTML = md(t); box.scrollTop = box.scrollHeight; });
    u.chat.push({ role: "assistant", content: answer }); save();
    pend.innerHTML = md(answer); pend.removeAttribute("id");
  } catch (e) {
    const code = e && e.code;
    const msg = code === "not_granted" || code === "sampling_disabled" ? "A IA não foi autorizada nesta tela. Vou responder no modo básico." :
      code === "rate_limited" ? "Muitas perguntas seguidas. Espere um pouquinho e tente de novo." :
      code === "refused" ? "Não consigo responder essa pergunta. Que tal falar com seu médico?" :
      "Não consegui falar com a IA agora. Tente de novo em instantes.";
    if (code === "not_granted" || code === "sampling_disabled") { AI.mode = "offline"; refreshChatMode(); }
    u.chat.pop(); save();
    pend.classList.add("err-msg"); pend.innerHTML = `<p>${msg}</p>`; pend.removeAttribute("id");
  } finally {
    S.busy = false; const b = $(".send"); if (b) b.disabled = false;
    box.scrollTop = box.scrollHeight;
  }
}

  const numbers = () => `${contact ? row(contact.name, contact.num) : ""}${row("SAMU", "192", true)}${row("Bombeiros", "193", true)}`;
  openSheet(`<div class="sos-sheet" id="sosBody"><h2>Pedindo ajuda</h2><p class="sub">Ligando para ${esc(contact ? contact.name : "o SAMU")} em</p>
    <div class="sos-count" id="sosN">${n}</div><button class="btn-ghost" data-act="close">Cancelar</button></div>`);
  S.sosTimer = setInterval(() => {
    n--; const el = $("#sosN");
    if (!el) { clearInterval(S.sosTimer); S.sosTimer = null; return; }
    if (n > 0) { el.textContent = n; if (navigator.vibrate) navigator.vibrate(120); return; }
    clearInterval(S.sosTimer); S.sosTimer = null;
    $("#sosBody").innerHTML = `<h2 style="color:var(--sos)">Emergência</h2><p class="sub">Escolha para quem ligar.</p>${numbers()}<button class="btn-ghost" data-act="close">Fechar</button>`;
    startCall(contact ? contact.name : "SAMU", contact ? contact.num : "192");
  }, 1000);
}

/* ---------- Ligação simulada (som e animação realistas) ---------- */
const CALL = { el: null, timers: [], ctx: null, gain: null, speaker: false, start: 0 };
function audio() {
  try {
    if (!CALL.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; CALL.ctx = new AC(); }
    if (CALL.ctx.state === "suspended") CALL.ctx.resume();
    return CALL.ctx;
  } catch { return null; }
}
function tone(freqs, start, dur, vol = 0.12) {
  const ctx = audio(); if (!ctx) return;
  const t0 = ctx.currentTime + start, g = ctx.createGain();
  const v = vol * (CALL.speaker ? 1.8 : 1);
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(v, t0 + 0.02);
  g.gain.setValueAtTime(v, t0 + dur - 0.03); g.gain.linearRampToValueAtTime(0, t0 + dur);
  g.connect(ctx.destination);
  for (const f of [].concat(freqs)) { const o = ctx.createOscillator(); o.type = "sine"; o.frequency.value = f; o.connect(g); o.start(t0); o.stop(t0 + dur + 0.02); }
}
const DTMF = { 1: [697, 1209], 2: [697, 1336], 3: [697, 1477], 4: [770, 1209], 5: [770, 1336], 6: [770, 1477], 7: [852, 1209], 8: [852, 1336], 9: [852, 1477], "*": [941, 1209], 0: [941, 1336], "#": [941, 1477] };
const KEYS = [["1", ""], ["2", "ABC"], ["3", "DEF"], ["4", "GHI"], ["5", "JKL"], ["6", "MNO"], ["7", "PQRS"], ["8", "TUV"], ["9", "WXYZ"], ["*", ""], ["0", "+"], ["#", ""]];
const later = (fn, ms) => CALL.timers.push(setTimeout(fn, ms));
function startCall(name, num) {
  endCall(true);
  const emerg = /^(192|193|190)$/.test(String(num).replace(/\D/g, ""));
  const initials = emerg ? I.cross : esc(name.replace(/\(.*?\)/g, "").trim().split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase() || "?");
  const sub = num === "192" ? "Serviço de Atendimento Móvel de Urgência" : num === "193" ? "Corpo de Bombeiros" : "celular";
  const el = document.createElement("div");
  el.className = "call-screen" + (emerg ? " emerg" : ""); el.setAttribute("role", "dialog"); el.setAttribute("aria-label", `Ligação para ${name}`);
  el.innerHTML = `
    <p class="call-status" id="callStatus" aria-live="polite">Discando…</p>
    <h2 class="call-name">${esc(name)}</h2>
    <p class="call-num">${esc(num)}</p>
    <p class="call-sub">${esc(sub)}</p>
    <div class="call-mid">
      <div class="call-avatar" id="callAvatar"><span class="ring"></span><span class="ring"></span><span class="ring"></span><span class="av">${initials}</span></div>
      <div class="keypad" id="callKeypad" hidden><p class="typed" id="callTyped"></p>
        <div class="keys">${KEYS.map(([k, l]) => `<button class="key" data-key="${k}" aria-label="${k}"><b>${k}</b><small>${l}</small></button>`).join("")}</div></div>
    </div>
    <div class="call-actions">
      <button data-call="mute" aria-pressed="false"><span class="cb">${I.mic}</span>Mudo</button>
      <button data-call="keypad" aria-pressed="false"><span class="cb">${I.grid}</span>Teclado</button>
      <button data-call="speaker" aria-pressed="false"><span class="cb">${I.speaker}</span>Viva-voz</button>
    </div>
    <div class="call-bottom"><button class="end-call" data-call="end" aria-label="Encerrar ligação">${I.phone}</button>
      <button class="kp-hide" data-call="keypad-hide" hidden>Ocultar</button></div>
    <p class="call-note">Simulação para demonstração · nenhuma ligação real é feita</p>`;
  layer().appendChild(el); CALL.el = el; S.inCall = true; statusBar();
  const st = (t) => { const x = $("#callStatus"); if (x) x.textContent = t; };
  // Toque de chamada brasileiro: 425 Hz, 1 s ligado e 4 s desligado (aqui encurtado)
  later(() => { st("Chamando…"); tone(425, 0, 1); }, 1100);
  later(() => tone(425, 0, 1), 4100);
  later(() => {
    st("00:00"); el.classList.add("connected"); CALL.start = Date.now();
    tone([1400], 0, 0.06, 0.05); if (navigator.vibrate) navigator.vibrate(60);
    if (emerg) el.querySelector(".call-sub").textContent = num === "192" ? "SAMU 192 · central de regulação" : "Bombeiros 193 · central de atendimento";
    CALL.timers.push(setInterval(() => { const sec = Math.floor((Date.now() - CALL.start) / 1000); st(`${pad2(Math.floor(sec / 60))}:${pad2(sec % 60)}`); }, 500));
  }, 6400);
  setTimeout(() => el.querySelector(".end-call").focus({ preventScroll: true }), 50);
}
function setKeypad(on) {
  const el = CALL.el; if (!el) return;
  el.classList.toggle("kp", on); $("#callKeypad").hidden = !on; $("#callAvatar").hidden = on;
  el.querySelector(".kp-hide").hidden = !on;
}
function endCall(silent) {
  const el = CALL.el; if (!el) return;
  CALL.timers.forEach((t) => { clearTimeout(t); clearInterval(t); }); CALL.timers = [];
  CALL.el = null; CALL.speaker = false;
  if (silent) { el.remove(); S.inCall = false; statusBar(); return; }
  const x = el.querySelector("#callStatus"); if (x) x.textContent = "Chamada encerrada";
  el.classList.remove("connected"); el.querySelectorAll(".ring").forEach((r) => r.remove());
  [0, 0.35, 0.7].forEach((t) => tone(425, t, 0.22, 0.08));
  setTimeout(() => { el.classList.add("leaving"); setTimeout(() => { el.remove(); S.inCall = false; statusBar(); }, 400); }, 1100);
}
document.addEventListener("click", (e) => {
  const k = e.target.closest(".key");
  if (k && CALL.el) { const v = k.dataset.key; tone(DTMF[v], 0, 0.15, 0.08); const t = $("#callTyped"); if (t) t.textContent = (t.textContent + v).slice(-14); return; }
  const b = e.target.closest("[data-call]"); if (!b || !CALL.el) return;
  const what = b.dataset.call;
  if (what === "end") return endCall();
  if (what === "keypad-hide") { const kb = CALL.el.querySelector('[data-call="keypad"]'); kb.setAttribute("aria-pressed", "false"); setKeypad(false); return; }
  const on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", on);
  if (what === "speaker") CALL.speaker = on;
  if (what === "keypad") setKeypad(on);
});

function openGoogle() {
  openSheet(`<div style="display:flex;align-items:center;gap:10px">${I.google}<h2>Escolha uma conta</h2></div>
    <p class="sub">para continuar no OldHealthy</p>
    <button class="google-acc" data-act="googleDemo"><span class="av">M</span><span><b>Maria</b><br><small style="color:var(--muted)">maria@oldhealthy.app</small></span></button>
    <button class="google-acc" data-act="googleOther"><span class="av" style="background:var(--teal-2)">+</span><span><b>Usar outra conta</b><br><small style="color:var(--muted)">Criar cadastro com seu email</small></span></button>
    <p class="set-note">Demonstração: o login real com Google precisa de um ID de cliente do Google configurado na publicação.</p>`);
}
function applySettings() {
  const st = DB.settings, root = document.documentElement;
  root.style.fontSize = st.font * 100 + "%";
  root.classList.toggle("fs-1", st.font > 1 && st.font < 1.2);
  root.classList.toggle("fs-2", st.font >= 1.2);
  if (st.theme === "auto") root.removeAttribute("data-oh-theme"); else root.setAttribute("data-oh-theme", st.theme);
}

/* ---------- Lembretes em tempo real ---------- */
const fired = new Set();
function showAlert(title, body, withNote) {
  document.querySelectorAll(".alert-banner").forEach((x) => x.remove());
  const el = document.createElement("div"); el.className = "alert-banner"; el.setAttribute("role", "alert");
  el.innerHTML = `<span class="circ-ico">${I.alarm}</span><div class="grow"><h4>${esc(title)}</h4><p>${esc(body)}</p></div>${withNote ? `<button class="pill-btn" data-act="alertNote" style="padding:10px 14px">Anotar</button>` : ""}<button class="pill-btn ok-btn" style="padding:10px 16px">Ok</button>`;
  el.querySelector(".ok-btn").onclick = () => el.remove();
  layer().appendChild(el);
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  try { if (typeof Notification !== "undefined" && Notification.permission === "granted") new Notification(title, { body }); } catch { /* ignore */ }
}
function tick() {
  const u = me(); if (!u) return;
  const hm = nowHM(), key = ymd() + hm;
  for (const r of u.lembretes) if (r.on && r.time === hm && !fired.has(key + r.id)) { fired.add(key + r.id); showAlert(r.title, r.desc || "Hora do seu lembrete", /press/i.test(norm(r.title))); }
  for (const m of u.meds) if (m.freq !== "Se necessário" && !isTaken(m) && m.time === hm && !fired.has(key + m.id)) { fired.add(key + m.id); showAlert(`Hora do remédio: ${m.name}`, m.dose || "Tome conforme orientação"); }
}

/* ---------- Render e eventos ---------- */
function render() {
  if (!me() && !["welcome", "auth"].includes(S.view)) S.view = "welcome";
  if (me() && !me().notas) me().notas = [];
  $("#app").innerHTML = (V[S.view] || V.welcome)();
  statusBar();
  if (S.view === "chat") { const b = $("#msgs"); b.scrollTop = b.scrollHeight; }
}

document.addEventListener("click", async (e) => {
  const g = e.target.closest("[data-go]");
  if (g) { closeSheet(); go(g.dataset.go); return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act, u = me();
  switch (act) {
    case "back": back(); break;
    case "close": closeSheet(); break;
    case "tab": S.authTab = a.dataset.tab; S.showPass = false; render(); break;
    case "eye": {
      const inp = a.parentElement.querySelector("input"); S.showPass = !S.showPass;
      inp.type = S.showPass ? "text" : "password"; a.innerHTML = S.showPass ? I.eye : I.eyeOff; a.setAttribute("aria-label", S.showPass ? "Esconder senha" : "Mostrar senha"); break;
    }
    case "google": openGoogle(); break;
    case "googleDemo": await ensureDemo(); DB.session = "maria@oldhealthy.app"; save(); closeSheet(); S.stack = []; go("home", { replace: true }); break;
    case "googleOther": closeSheet(); S.authTab = "cadastro"; render(); break;
    case "take": { const m = u.meds.find((x) => x.id === a.dataset.id); if (m) { m.takenOn = isTaken(m) ? null : ymd(); save(); render(); if (m.takenOn) toast(`${m.name} marcado como tomado`); } break; }
    case "del": confirmDelete(a.dataset.kind, a.dataset.id); break;
    case "doDel": { const k = a.dataset.kind; u[k] = u[k].filter((x) => x.id !== a.dataset.id); save(); closeSheet(); render(); toast("Apagado"); break; }
    case "add": openAdd(a.dataset.kind); break;
    case "toggleRem": { const r = u.lembretes.find((x) => x.id === a.dataset.id); r.on = !r.on; save(); render(); break; }
    case "period": S.period = Number(a.dataset.n); render(); break;
    case "mood": S.checkinDraft.mood = a.dataset.k; render(); break;
    case "ckToggle": S.checkinDraft[a.dataset.k] = !S.checkinDraft[a.dataset.k]; a.setAttribute("aria-checked", S.checkinDraft[a.dataset.k]); break;
    case "sendCheckin": {
      const d = S.checkinDraft; u.checkins[ymd()] = { mood: d.mood, slept: !!d.slept, pain: !!d.pain, meds: !!d.meds }; save();
      S.stack = []; go("home", { replace: true }); toast(d.mood === "mal" ? "Check-in salvo. Se piorar, fale com alguém ou use o SOS." : "Check-in enviado! Obrigado.");
      break;
    }
    case "day": S.agendaDay = a.dataset.d; render(); break;
    case "chip": sendChat(a.textContent); break;
    case "call": audio(); startCall(a.dataset.name, a.dataset.num); break;
    case "copy": {
      const v = a.dataset.v;
      navigator.clipboard.writeText(v).then(() => toast(`Número ${v} copiado`), () => {
        const r = document.createRange(); const b = a.parentElement.querySelector("b"); r.selectNodeContents(b);
        const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast("Número selecionado: copie e disque");
      });
      break;
    }
    case "sos": openSOS(); break;
    case "editProfile": openProfileEdit(); break;
    case "font": { const y = getScroll(); DB.settings.font = Number(a.dataset.v); save(); applySettings(); render(); setScroll(y); break; }
    case "theme": { const y = getScroll(); DB.settings.theme = a.dataset.v; save(); applySettings(); render(); setScroll(y); break; }
    case "notifPerm": { try { await Notification.requestPermission(); } catch { /* sem suporte */ } const y = getScroll(); render(); setScroll(y); break; }
    case "backup": exportBackup(); break;
    case "restore": $("#restoreFile").click(); break;
    case "doRestore": doRestore(); break;
    case "edit": openForm(a.dataset.kind, me()[a.dataset.list || a.dataset.kind].find((x) => x.id === a.dataset.id)); break;
    case "addNote": openForm(a.dataset.kind); break;
    case "alertNote": a.closest(".alert-banner").remove(); go("notas"); openForm("pressao"); break;
    case "clearChat": u.chat = []; save(); toast("Conversa apagada"); break;
    case "resetDemo": openSheet(`<h2>Restaurar dados de exemplo?</h2><p class="sub">Tudo o que foi anotado nesta conta será trocado pelos dados de exemplo da Maria.</p><button class="btn-danger" data-act="doResetDemo">Restaurar</button><button class="btn-ghost" data-act="close">Cancelar</button>`); break;
    case "doResetDemo": DB.users["maria@oldhealthy.app"] = await demoUser(); save(); closeSheet(); render(); toast("Dados de exemplo restaurados"); break;
    case "logout": DB.session = null; save(); closeSheet(); S.stack = []; S.view = "welcome"; render(); break;
  }
});

document.addEventListener("submit", async (e) => {
  const f = e.target;
  if (f.id === "chatForm") { e.preventDefault(); sendChat($("#chatInput").value); return; }
  if (f.id === "loginForm") {
    e.preventDefault();
    const email = norm($("#lgEmail").value), pass = $("#lgPass").value;
    if (email === "maria@oldhealthy.app") await ensureDemo();
    const u = DB.users[email];
    if (!u || u.pass !== await hashPass(pass)) { $("#authErr").textContent = "Email ou senha incorretos. Confira e tente de novo."; return; }
    DB.session = email; save(); S.stack = []; S.showPass = false; go("home", { replace: true });
  }
  if (f.id === "signupForm") {
    e.preventDefault();
    const name = $("#suName").value.trim(), age = Number($("#suAge").value), email = norm($("#suEmail").value), pass = $("#suPass").value;
    const err = !name ? "Digite seu nome." : !(age > 0 && age < 121) ? "Digite uma idade válida." : !/^\S+@\S+\.\S+$/.test(email) ? "Digite um email válido." : pass.length < 6 ? "A senha precisa ter pelo menos 6 caracteres." : DB.users[email] ? "Este email já tem cadastro. Use a aba Login." : "";
    if (err) { $("#authErr").textContent = err; return; }
    DB.users[email] = { email, pass: await hashPass(pass), profile: { name, age, contactName: "", contactPhone: "", blood: "", allergies: "" }, meds: [], consultas: [], lembretes: [], checkins: {}, chat: [], notas: [] };
    DB.session = email; save(); S.stack = []; S.showPass = false; go("home", { replace: true }); toast(`Bem-vindo(a), ${name.split(" ")[0]}!`);
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if (CALL.el) endCall(); else closeSheet(); }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
});

async function ensureDemo() { if (!DB.users["maria@oldhealthy.app"]) { DB.users["maria@oldhealthy.app"] = await demoUser(); save(); } }

/* ---------- Moldura de celular no computador ---------- */
const LIGHT_BAR = ["auth", "meds", "consultas", "lembretes", "bemestar", "checkin", "notif", "perfil", "notas"];
function fitPhone() {
  const root = document.documentElement;
  const on = window.innerWidth >= PHONE_MIN_W;
  root.classList.toggle("phone-mode", on);
  if (on) root.style.setProperty("--ps", Math.min(1, (window.innerHeight - 32) / 876, (window.innerWidth - 32) / 422).toFixed(3));
}
function statusBar() {
  const sb = $("#statusbar"); if (!sb) return;
  $("#sbTime").textContent = nowHM();
  sb.classList.toggle("light", LIGHT_BAR.includes(S.view) || !!S.inCall);
  sb.classList.toggle("in-call", !!S.inCall);
  sb.classList.toggle("chat", S.view === "chat");
  const sc = scroller(); sb.classList.toggle("solid", !!sc && sc.scrollTop > 8);
}
$("#scroller").addEventListener("scroll", () => { const sb = $("#statusbar"); const sc = scroller(); if (sb && sc) sb.classList.toggle("solid", sc.scrollTop > 8); }, { passive: true });
window.addEventListener("resize", fitPhone);
fitPhone();

/* ---------- Início ---------- */
load();
applySettings();
if (me()) S.view = "home";
render();
AI.ready = detectAI();
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && window.top === window.self && !window.claude) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
setInterval(statusBar, 15000);
setInterval(() => { tick(); if (S.view === "home" && !$("#overlay")) { /* mantém contadores atualizados */ const y = getScroll(); render(); setScroll(y); } }, 30000);
})();
</script>
