<title>OldHealthy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0E7C72">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column (max 480px), screens swapped by JS; inner screens get a teal header band, main tabs get a bottom nav. */
:root {
  --bg: #EAF2F8;
  --bg-top: #DAE8F4;
  --surface: #FFFFFF;
  --surface-2: #F4F8FA;
  --ink: #18227A;
  --text: #1E2A33;
  --muted: #5A6A76;
  --line: #D3E3E7;
  --teal: #0E7C72;
  --teal-strong: #0E7C72;
  --teal-2: #4DB6AC;
  --teal-soft: #E2F1EF;
  --teal-tint: #E6F3F1;
  --sos: #D32F2F;
  --sos-soft: #FBE3E3;
  --gear: #1E7FE0;
  --ok: #2E7D32;
  --ok-soft: #E3F0E4;
  --lilac: #A98BDF;
  --lilac-soft: #F2EDFB;
  --warn: #EF7D16;
  --sun-soft: #FFF5D9;
  --sun: #F2B01E;
  --shadow: 0 6px 22px rgba(24, 50, 90, .08);
  --on-teal: #FFFFFF;
  --font-display: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r-lg: 28px;
  --r-md: 20px;
  --r-sm: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C181E; --bg-top: #102530; --surface: #14232A; --surface-2: #192C34;
    --ink: #CBD8FF; --text: #E5EDF1; --muted: #9DB0BA; --line: #27414B;
    --teal: #5CC8BB; --teal-strong: #0F6E65; --teal-2: #3FA79B; --teal-soft: #1A3B3C; --teal-tint: #173337;
    --sos: #E5484D; --sos-soft: #3A1E22; --gear: #3B8FEA; --ok: #5DBB63; --ok-soft: #1D3324;
    --lilac: #B9A0EC; --lilac-soft: #2A2440; --warn: #F59A45; --sun-soft: #3A321A; --sun: #F5C24A;
    --shadow: 0 6px 22px rgba(0,0,0,.35); color-scheme: dark;
  }
}
:root[data-theme="dark"], :root[data-oh-theme="dark"] {
  --bg: #0C181E; --bg-top: #102530; --surface: #14232A; --surface-2: #192C34;
  --ink: #CBD8FF; --text: #E5EDF1; --muted: #9DB0BA; --line: #27414B;
  --teal: #5CC8BB; --teal-strong: #0F6E65; --teal-2: #3FA79B; --teal-soft: #1A3B3C; --teal-tint: #173337;
  --sos: #E5484D; --sos-soft: #3A1E22; --gear: #3B8FEA; --ok: #5DBB63; --ok-soft: #1D3324;
  --lilac: #B9A0EC; --lilac-soft: #2A2440; --warn: #F59A45; --sun-soft: #3A321A; --sun: #F5C24A;
  --shadow: 0 6px 22px rgba(0,0,0,.35); color-scheme: dark;
}
:root[data-oh-theme="light"] {
  --bg: #EAF2F8; --bg-top: #DAE8F4; --surface: #FFFFFF; --surface-2: #F4F8FA;
  --ink: #18227A; --text: #1E2A33; --muted: #5A6A76; --line: #D3E3E7;
  --teal: #0E7C72; --teal-strong: #0E7C72; --teal-2: #4DB6AC; --teal-soft: #E2F1EF; --teal-tint: #E6F3F1;
  --sos: #D32F2F; --sos-soft: #FBE3E3; --gear: #1E7FE0; --ok: #2E7D32; --ok-soft: #E3F0E4;
  --lilac: #A98BDF; --lilac-soft: #F2EDFB; --warn: #EF7D16; --sun-soft: #FFF5D9; --sun: #F2B01E;
  --shadow: 0 6px 22px rgba(24, 50, 90, .08); color-scheme: light;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--font-body); font-size: 1rem; line-height: 1.45;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 3px solid var(--gear); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); color: var(--ink); margin: 0; text-wrap: balance; }
p { margin: 0; }
svg { display: block; }
.ico { width: 1.5rem; height: 1.5rem; flex: none; }

#shell {
  max-width: 480px; margin: 0 auto; min-height: 100%;
  background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg) 40%, var(--bg) 100%);
  position: relative; overflow-x: hidden;
}
.screen { min-height: 100vh; display: flex; flex-direction: column; }
.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.with-nav { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }

/* Floating settings gear (present on every screen, like the original) */
.gear {
  position: fixed; z-index: 40;
  top: calc(14px + env(safe-area-inset-top, 0px));
  right: max(16px, calc((100vw - 480px) / 2 + 16px), env(safe-area-inset-right, 0px));
  width: 58px; height: 58px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #4FA3F5, var(--gear) 60%);
  color: #fff; display: grid; place-items: center;
  box-shadow: 0 6px 18px rgba(30,127,224,.45), 0 0 0 4px rgba(30,127,224,.18);
}
.gear svg { width: 30px; height: 30px; }

/* Welcome */
.logo-tile {
  width: 74px; height: 74px; border-radius: 22px; background: var(--surface);
  display: grid; place-items: center; color: var(--teal-2); box-shadow: var(--shadow);
}
.logo-tile svg { width: 36px; height: 36px; }
.welcome-top { padding-top: 92px; }
.hero { display: grid; grid-template-columns: minmax(0, 1fr) 40%; align-items: center; gap: 8px; margin-top: 40px; }
.hero h1 { font-size: 2.35rem; line-height: 1.12; font-weight: 800; letter-spacing: -.01em; }
.hero p { margin-top: 18px; font-size: 1.08rem; color: var(--text); max-width: 30ch; }
.hero-img { width: calc(100% + 16px); max-width: none; margin-right: -16px; align-self: center; border-radius: 6px 0 0 6px; aspect-ratio: 434 / 615; object-fit: cover; }
.cta {
  margin-top: 30px; display: inline-flex; align-items: center; gap: 16px;
  padding: 10px 10px 10px 30px; border-radius: 999px; color: #fff;
  background: linear-gradient(90deg, #4DB6AC, #0E7C72);
  font-family: var(--font-display); font-weight: 800; font-size: 1.3rem;
  box-shadow: 0 10px 22px rgba(14,124,114,.28);
}
.cta .round { width: 52px; height: 52px; border-radius: 50%; background: #fff; color: #0E7C72; display: grid; place-items: center; }
.daily-card {
  margin: 44px 0 32px; padding: 26px 22px 30px; border-radius: 34px;
  background: color-mix(in srgb, var(--surface) 82%, transparent); box-shadow: var(--shadow);
}
.daily-card .row { display: flex; justify-content: space-between; align-items: center; }
.daily-card h2 { font-size: 1.45rem; font-weight: 700; }
.plus-btn { color: var(--teal-2); width: 44px; height: 44px; display: grid; place-items: center; }
.plus-btn svg { width: 34px; height: 34px; }
.tiles3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 22px; }
.tile3 { display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 1.1rem; color: var(--text); }
.tile3 .box { width: 100%; max-width: 104px; aspect-ratio: 1; border-radius: 24px; background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; color: var(--teal); }
.tile3 .box svg { width: 40px; height: 40px; }

/* Auth */
.auth-bg {
  height: 300px; position: relative; overflow: hidden;
  background:
    radial-gradient(circle at 18% 30%, rgba(255,255,255,.55) 0 3px, transparent 4px),
    radial-gradient(circle at 70% 48%, rgba(255,255,255,.7) 0 4px, transparent 6px),
    radial-gradient(circle at 46% 62%, rgba(255,255,255,.5) 0 5px, transparent 7px),
    radial-gradient(circle at 84% 22%, rgba(190,255,245,.6) 0 6px, transparent 9px),
    radial-gradient(circle at 30% 80%, rgba(255,255,255,.45) 0 3px, transparent 5px),
    radial-gradient(circle at 60% 15%, rgba(140,230,220,.55) 0 10px, transparent 16px),
    radial-gradient(circle at 10% 60%, rgba(140,230,220,.35) 0 14px, transparent 22px),
    radial-gradient(ellipse at 50% 50%, #3E9AA0 0%, #2B7A86 45%, #1E5966 100%);
}
.auth-bg::after {
  content: ""; position: absolute; inset: -20% -10%;
  background: linear-gradient(160deg, transparent 35%, rgba(200,255,250,.35) 48%, rgba(255,255,255,.15) 52%, transparent 62%);
}
.auth-tabs { position: absolute; z-index: 2; left: 0; right: 0; top: 110px; display: flex; justify-content: space-around; padding-right: 60px; }
.auth-tabs button { font-family: var(--font-display); font-weight: 800; letter-spacing: .06em; font-size: 1.45rem; color: rgba(255,255,255,.62); }
.auth-tabs button[aria-selected="true"] { color: #fff; }
.auth-sheet { background: var(--surface); border-radius: 44px 44px 0 0; margin-top: -60px; position: relative; z-index: 3; padding-top: 34px; padding-bottom: 40px; flex: 1; }
.auth-sheet h1 { color: var(--teal); text-align: center; font-size: 1.85rem; font-weight: 800; margin-bottom: 26px; }
.field { position: relative; margin-top: 22px; }
.field label { position: absolute; left: 24px; top: -11px; padding: 0 8px; background: var(--surface); color: var(--teal); font-size: .95rem; }
.field input, .field select, .field textarea {
  width: 100%; border: 2px solid color-mix(in srgb, var(--teal-2) 45%, transparent); border-radius: 999px;
  padding: 18px 24px; font-size: 1.15rem; background: var(--surface); color: var(--text);
}
.field textarea { border-radius: 22px; resize: vertical; min-height: 84px; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--teal); }
.field .eye { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); color: var(--muted); padding: 6px; }
.hint { text-align: right; font-style: italic; color: var(--muted); font-size: .92rem; margin-top: 16px; }
.btn-primary {
  width: 100%; margin-top: 26px; padding: 18px; border-radius: 999px; background: var(--teal-2); color: #fff;
  font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; letter-spacing: .18em;
  box-shadow: 0 12px 24px rgba(77,182,172,.3);
}
.btn-primary:disabled { opacity: .5; box-shadow: none; cursor: not-allowed; }
.btn-primary.plain { letter-spacing: .02em; }
.divider { display: flex; align-items: center; gap: 16px; color: var(--muted); margin: 28px 0 22px; font-size: 1.05rem; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.btn-google { width: 100%; padding: 16px; border-radius: 999px; border: 2px solid color-mix(in srgb, var(--teal-2) 40%, transparent); display: flex; justify-content: center; align-items: center; gap: 14px; font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; color: var(--ink); }
.err { color: var(--sos); margin-top: 14px; font-weight: 600; min-height: 1.4em; }

/* Home */
.brand { display: flex; align-items: center; gap: 16px; padding-top: 100px; }
.brand .logo-tile { width: 70px; height: 70px; }
.brand h2 { font-size: 1.6rem; font-weight: 800; }
.brand small { color: var(--muted); font-size: 1rem; }
.bell { margin-left: auto; position: relative; width: 70px; height: 70px; border-radius: 22px; background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; color: var(--teal-2); }
.bell svg { width: 32px; height: 32px; }
.badge { position: absolute; top: -8px; right: -6px; min-width: 28px; height: 28px; padding: 0 7px; border-radius: 999px; background: var(--sos); color: #fff; font-weight: 700; font-size: .9rem; display: grid; place-items: center; border: 3px solid var(--surface); font-variant-numeric: tabular-nums; }
.greet { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; margin-top: 36px; }
.greet h1 { font-size: 2.4rem; font-weight: 800; }
.greet p { font-size: 1.12rem; margin-top: 8px; }
.sos-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.sos {
  width: 152px; height: 152px; border-radius: 50%; background: var(--sos); color: #fff;
  font-family: var(--font-display); font-weight: 800; font-size: 2.6rem; letter-spacing: .04em;
  box-shadow: 0 0 0 7px var(--sos-soft), 0 0 0 11px var(--sos), 0 14px 30px rgba(211,47,47,.35);
}
.sos-label { color: var(--sos); font-family: var(--font-display); font-weight: 800; letter-spacing: .14em; font-size: .95rem; }
.card { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); }
.checkin-card { margin-top: 30px; display: flex; flex-wrap: wrap; align-items: center; gap: 14px 16px; padding: 18px; border: 2px solid color-mix(in srgb, var(--teal-2) 35%, transparent); background: color-mix(in srgb, var(--surface) 70%, transparent); }
.sun-box { width: 74px; height: 74px; border-radius: 20px; background: var(--sun-soft); display: grid; place-items: center; color: var(--sun); flex: none; }
.sun-box svg { width: 42px; height: 42px; }
.checkin-card h3 { font-size: 1.3rem; font-weight: 800; line-height: 1.15; }
.checkin-card p { color: var(--muted); font-size: 1.02rem; }
.checkin-card .grow { flex: 1; min-width: 150px; }
.checkin-card .pill-btn { margin-left: auto; }
.pill-btn { background: var(--teal-2); color: #fff; border-radius: 999px; padding: 14px 20px; font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; display: inline-flex; align-items: center; gap: 10px; white-space: nowrap; }
.today-card { margin-top: 22px; padding: 18px 18px 8px; }
.today-head { display: flex; align-items: center; gap: 16px; width: 100%; text-align: left; }
.sq-ico { width: 56px; height: 56px; border-radius: 16px; background: var(--teal-2); color: #fff; display: grid; place-items: center; flex: none; }
.today-head h3 { font-size: 1.4rem; font-weight: 800; flex: 1; }
.today-head .chev { color: var(--teal); }
.today-item { display: flex; align-items: center; gap: 16px; padding: 18px 6px; }
.today-item + .today-item { border-top: 1px solid var(--line); }
.circ-ico { width: 58px; height: 58px; border-radius: 50%; background: var(--teal-2); color: #fff; display: grid; place-items: center; flex: none; }
.circ-ico.lilac { background: var(--lilac); }
.today-item .grow { flex: 1; min-width: 0; }
.today-item h4 { margin: 0; font-family: var(--font-display); color: var(--ink); font-size: 1.2rem; font-weight: 800; }
.today-item p { font-size: 1.08rem; color: var(--text); }
.done-dot { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--teal-2); color: var(--teal-2); flex: none; }
.done-dot.on { background: var(--teal-2); color: #fff; }
.empty-line { color: var(--muted); padding: 14px 6px 18px; }
.grid4 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 22px; }
.feat { padding: 20px 12px 22px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; }
.feat .big { width: 108px; height: 108px; border-radius: 26px; display: grid; place-items: center; margin-bottom: 10px; background: var(--teal-tint); color: var(--teal-2); }
.feat .big svg { width: 50px; height: 50px; }
.feat .big.lilac { background: var(--lilac-soft); color: var(--lilac); }
.feat .big.teal { color: var(--teal); }
.feat h3 { font-size: 1.22rem; font-weight: 800; }
.feat p { color: var(--muted); font-size: .98rem; }
.help-card { margin-top: 22px; display: flex; align-items: center; gap: 16px; padding: 18px; width: 100%; text-align: left; border: 2px solid color-mix(in srgb, var(--teal-2) 35%, transparent); background: color-mix(in srgb, var(--surface) 70%, transparent); }
.help-card .bubble { width: 70px; height: 70px; border-radius: 50%; background: var(--teal-tint); color: var(--teal-2); display: grid; place-items: center; flex: none; }
.help-card .bubble svg { width: 38px; height: 38px; }
.help-card h3 { font-size: 1.28rem; font-weight: 800; }
.help-card p { color: var(--text); }
.help-card .grow { flex: 1; min-width: 0; }
.promo { display: grid; grid-template-columns: minmax(0, 1fr) 42%; gap: 14px; align-items: center; margin-top: 30px; }
.promo h2 { font-size: 1.75rem; font-weight: 800; line-height: 1.15; }
.promo p { color: var(--muted); margin-top: 8px; }
.promo img { width: 100%; border-radius: 18px; aspect-ratio: 1; object-fit: cover; object-position: top; }

/* Bottom nav */
.nav {
  position: fixed; z-index: 30; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(4, 1fr);
  padding: 10px max(8px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
.nav button { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); font-size: 1.02rem; font-weight: 500; padding: 4px 0; }
.nav button svg { width: 34px; height: 34px; }
.nav button[aria-current="page"] { color: var(--teal); font-weight: 700; }

/* Inner screen header */
.head-band {
  background: var(--teal-strong); color: #fff; border-radius: 0 0 30px 30px;
  padding-top: calc(28px + env(safe-area-inset-top, 0px)); padding-bottom: 22px;
  display: flex; align-items: center; gap: 16px;
  padding-right: max(92px, env(safe-area-inset-right, 0px));
}
.head-band .back { width: 58px; height: 58px; border-radius: 50%; background: rgba(255,255,255,.18); color: #fff; display: grid; place-items: center; flex: none; }
.head-band h1 { color: #fff; font-size: 1.8rem; font-weight: 800; }
.head-band p { color: rgba(255,255,255,.85); font-size: 1.02rem; }
.list { display: flex; flex-direction: column; gap: 16px; margin-top: 22px; padding-bottom: 120px; }
.fab {
  position: fixed; z-index: 25; right: max(18px, calc((100vw - 480px) / 2 + 18px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  height: 62px; padding: 0 24px 0 18px; border-radius: 999px; background: var(--teal-strong); color: #fff;
  display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 800; font-size: 1.1rem;
  box-shadow: 0 10px 24px rgba(14,124,114,.38);
}
.fab.raise { bottom: calc(108px + env(safe-area-inset-bottom, 0px)); }

/* Medicamentos */
.med { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 20px 16px; }
.med.taken { background: var(--teal-tint); box-shadow: none; }
.med .t { text-align: center; }
.med .t b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 1.75rem; color: var(--teal); font-variant-numeric: tabular-nums; line-height: 1.1; }
.med.taken .t b { color: var(--teal-2); }
.med .t span { color: var(--muted); font-size: .92rem; }
.med h3 { font-size: 1.4rem; font-weight: 800; }
.med.taken h3 { color: color-mix(in srgb, var(--ink) 65%, var(--lilac)); }
.med .dose { font-size: 1.1rem; }
.med .note { font-style: italic; color: var(--muted); }
.med .actions { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.take { width: 62px; height: 62px; border-radius: 50%; background: var(--teal-2); color: #fff; display: grid; place-items: center; opacity: .8; }
.take.on { background: #5E9E62; opacity: 1; }
.trash { color: #E05252; padding: 6px; }
.allergy { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; color: var(--sos); background: var(--sos-soft); border-radius: 999px; padding: 4px 10px; font-size: .88rem; font-weight: 700; }
.allergy svg { width: 16px; height: 16px; }

/* Consultas */
.appt { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 18px 16px; }
.datebox { background: var(--teal-tint); border-radius: 18px; padding: 12px 14px; text-align: center; min-width: 118px; }
.datebox small { display: block; color: var(--teal); font-family: var(--font-display); font-weight: 700; font-size: .98rem; font-variant-numeric: tabular-nums; }
.datebox b { font-family: var(--font-display); font-weight: 800; font-size: 1.75rem; color: var(--ink); font-variant-numeric: tabular-nums; }
.appt h3 { font-size: 1.3rem; font-weight: 800; overflow-wrap: anywhere; }
.appt p { font-size: 1.05rem; }
.appt .place { display: flex; gap: 6px; color: var(--muted); align-items: flex-start; margin-top: 4px; }
.appt .place svg { width: 18px; height: 18px; color: var(--teal); margin-top: 3px; }
.appt.past { opacity: .6; }
.sec-title { font-family: var(--font-display); color: var(--muted); font-weight: 700; font-size: .95rem; letter-spacing: .08em; text-transform: uppercase; margin-top: 10px; }

/* Lembretes */
.rem { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 16px; }

const pad2 = (n) => String(n).padStart(2, "0");
const ymd = (d = new Date()) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const parseYmd = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const brDate = (s) => { const d = parseYmd(s); return `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)}/${d.getFullYear()}`; };
const ddmm = (d) => `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)}`;
const nowHM = () => { const d = new Date(); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };

const norm = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim();

async function hashPass(p) {
  try {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("oh:" + p));
    return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
  } catch {
    let h = 5381; for (const ch of "oh:" + p) h = ((h << 5) + h + ch.charCodeAt(0)) | 0; return "f" + (h >>> 0).toString(16);
  }
}

function go(view, opts = {}) {
  if (!opts.replace && S.view !== view) S.stack.push(S.view);
  if (MAIN.includes(view)) S.stack = S.stack.filter((v) => !MAIN.includes(v) || v === "home");

  render();

const isTaken = (m) => m.takenOn === ymd();
const sortTime = (a, b) => a.time.localeCompare(b.time);
function allergyHit(medName, allergies) {
  const a = norm(allergies).split(/[,;\/]| e /).map((x) => x.trim()).filter((x) => x.length > 2);
  const n = norm(medName);
  return a.some((x) => n.includes(x) || x.includes(n));
}
function pendingToday(u) {
  const hm = nowHM();
  const meds = u.meds.filter((m) => m.freq !== "Se necessário" && !isTaken(m));
  const rems = u.lembretes.filter((r) => r.on && r.time >= hm);
  const soon = u.consultas.filter((c) => { const d = parseYmd(c.date); const diff = (d - parseYmd(ymd())) / 864e5; return diff >= 0 && diff <= 7; });
  return { meds, rems, soon, count: meds.length + rems.length + soon.length };
}

const CHIPS = ["Posso caminhar com pressão alta?", "Como melhorar meu sono?", "O que comer para controlar a diabetes?", "Posso tomar Dorflex junto com Losartana?", "Dicas para não esquecer os remédios"];
function md(text) {
  const lines = esc(text).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").split(/\n/);
  let out = "", list = null, para = [];
  const flushP = () => { if (para.length) { out += `<p>${para.join("<br>")}</p>`; para = []; } };
  const flushL = () => { if (list) { out += `<${list.t}>${list.items.map((i) => `<li>${i}</li>`).join("")}</${list.t}>`; list = null; } };
  for (const raw of lines) {
    const l = raw.trim();
    const ul = l.match(/^[-*•]\s+(.*)/), ol = l.match(/^\d+[.)]\s+(.*)/);
    if (ul || ol) { flushP(); const t = ul ? "ul" : "ol"; if (!list || list.t !== t) { flushL(); list = { t, items: [] }; } list.items.push((ul || ol)[1]); }
    else if (!l) { flushP(); flushL(); }
    else { flushL(); para.push(l.replace(/^#+\s*/, "")); }
  }
  flushP(); flushL();
  return out;
}

const AI = { mode: "checking", sample: null };
async function detectAI() {
  if (window.claude && typeof window.claude.use === "function") {
    try { AI.sample = await window.claude.use("sample"); } catch { AI.sample = null; }
    if (AI.sample) { AI.mode = "claude"; refreshChatMode(); return; }
  }
  try {
    const r = await fetch("api/health", { cache: "no-store" });
    const j = r.ok ? await r.json() : null;
    AI.mode = j && j.ai ? "server" : (j ? "server-nokey" : "offline");

  refreshChatMode();
}

    [/triste|sozinh|ansied|deprim|desanim|medo/, () => `${first}, obrigada por contar como está se sentindo.\n- Converse com alguém de confiança, como o ${p.contactName || "seu contato de emergência"}.\n- Sair um pouco ao sol e caminhar ajuda o humor.\n- Grupos de convivência e igreja são ótimas companhias.\n- Se a tristeza durar muitos dias, fale com o médico. Você merece cuidado.`],
    [/gripe|resfri|vacina|febre|tosse/, () => "Sobre gripe e vacinas:\n- Tome a **vacina da gripe todo ano**, de graça no posto de saúde.\n- Descanse e beba bastante líquido.\n- Febre alta, falta de ar ou tosse por mais de uma semana: procure o médico."],
    [/intestino|prisao de ventre|constip/, () => "Para o intestino funcionar melhor:\n- Beba bastante água.\n- Coma frutas como mamão e ameixa, e verduras.\n- Caminhe todos os dias.\n- Tente ir ao banheiro sempre no mesmo horário."],
  ];
  let answer = null;
  if (meds.length) {
    const list = meds.map((m) => `- **${m.name}** ${m.dose ? "(" + m.dose + ")" : ""} às ${m.time}${m.note ? ": " + m.note.toLowerCase() : ""}`).join("\n");
    answer = `Pelo que está no seu app:\n${list}\n\n${meds.length > 1 || /junto|mistur|mesmo tempo|com /.test(n) ? "Muitos remédios podem ser tomados no mesmo dia, mas **misturar ou mudar horários deve ser confirmado com seu médico ou farmacêutico**." : "Tome sempre na dose e no horário que o médico passou. Na dúvida, pergunte ao farmacêutico."}`;
  } else {
    for (const [re, fn] of T) if (re.test(n)) { answer = fn(); break; }
  }
  if (!answer && /remedio|medica|dose|tomar|comprimido/.test(n)) answer = "Sobre remédios, o mais seguro é **confirmar com seu médico ou farmacêutico** antes de mudar a dose, o horário ou tomar algo novo. Leve a lista da tela **Medicamentos** na próxima consulta.";
  if (!answer) answer = `Boa pergunta, ${first}! Posso ajudar com **pressão**, **diabetes**, **sono**, **alimentação**, **exercícios**, **dores**, **tontura**, **quedas** e com os seus **remédios**. Para qualquer sintoma novo ou forte, fale com seu médico. Em emergência, ligue **192**.`;
  if (allergyHits.length) answer = `**Atenção:** você tem alergia cadastrada a **${allergyHits.join(", ")}**. Não tome sem falar com o médico.\n\n` + answer;
  return answer;
}

async function askAI(u, onText) {
  if (AI.ready) await AI.ready;
  const turns = u.chat.slice(-20).map((m) => ({ role: m.role, content: m.content }));
  if (AI.mode === "claude" && AI.sample) {
    const r = await AI.sample([{ role: "user", content: RULES(u) }, ...turns], { cache: false, effort: "low", onText: ({ text }) => onText(text) });
    return r.text;
  }
  if (AI.mode === "server") {
    const r = await fetch("api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ messages: turns, context: userContext(u) }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw { code: "server", message: j.error || "Falha no servidor" };
    return j.text;
  }
  const full = offlineAnswer(turns[turns.length - 1].content, u);
  await new Promise((r) => setTimeout(r, 700));
  const words = full.split(/(\s+)/);
  for (let i = 0; i < words.length; i += 4) { onText(words.slice(0, i + 4).join("")); await new Promise((r) => setTimeout(r, 35)); }
  return full;
}

async function sendChat(text) {
  const u = me(); text = text.trim();
  if (!text || S.busy) return;
  S.busy = true;
  u.chat.push({ role: "user", content: text }); save();
  const box = $("#msgs");
  box.insertAdjacentHTML("beforeend", `<div class="msg me">${esc(text)}</div><div class="msg ai" id="pending"><span class="typing"><i></i><i></i><i></i></span></div>`);
  box.scrollTop = box.scrollHeight;
  $("#chatInput").value = ""; $(".send").disabled = true;
  const pend = $("#pending");
  try {
    const answer = await askAI(u, (t) => { pend.innerHTML = md(t); box.scrollTop = box.scrollHeight; });
    u.chat.push({ role: "assistant", content: answer }); save();
    pend.innerHTML = md(answer); pend.removeAttribute("id");
  } catch (e) {
    const code = e && e.code;
    const msg = code === "not_granted" || code === "sampling_disabled" ? "A IA não foi autorizada nesta tela. Vou responder no modo básico." :
      code === "rate_limited" ? "Muitas perguntas seguidas. Espere um pouquinho e tente de novo." :
      code === "refused" ? "Não consigo responder essa pergunta. Que tal falar com seu médico?" :
      "Não consegui falar com a IA agora. Tente de novo em instantes.";
    if (code === "not_granted" || code === "sampling_disabled") { AI.mode = "offline"; refreshChatMode(); }
    u.chat.pop(); save();
    pend.classList.add("err-msg"); pend.innerHTML = `<p>${msg}</p>`; pend.removeAttribute("id");
  } finally {
    S.busy = false; const b = $(".send"); if (b) b.disabled = false;
    box.scrollTop = box.scrollHeight;
  }
}

function tick() {
  const u = me(); if (!u) return;
  const hm = nowHM(), key = ymd() + hm;
  for (const r of u.lembretes) if (r.on && r.time === hm && !fired.has(key + r.id)) { fired.add(key + r.id); showAlert(r.title, r.desc || "Hora do seu lembrete"); }
  for (const m of u.meds) if (m.freq !== "Se necessário" && !isTaken(m) && m.time === hm && !fired.has(key + m.id)) { fired.add(key + m.id); showAlert(`Hora do remédio: ${m.name}`, m.dose || "Tome conforme orientação"); }

  if (f.id === "signupForm") {
    e.preventDefault();
    const name = $("#suName").value.trim(), age = Number($("#suAge").value), email = norm($("#suEmail").value), pass = $("#suPass").value;
    const err = !name ? "Digite seu nome." : !(age > 0 && age < 121) ? "Digite uma idade válida." : !/^\S+@\S+\.\S+$/.test(email) ? "Digite um email válido." : pass.length < 6 ? "A senha precisa ter pelo menos 6 caracteres." : DB.users[email] ? "Este email já tem cadastro. Use a aba Login." : "";
    if (err) { $("#authErr").textContent = err; return; }
    DB.users[email] = { email, pass: await hashPass(pass), profile: { name, age, contactName: "", contactPhone: "", blood: "", allergies: "" }, meds: [], consultas: [], lembretes: [], checkins: {}, chat: [] };
    DB.session = email; save(); S.stack = []; S.showPass = false; go("home", { replace: true }); toast(`Bem-vindo(a), ${name.split(" ")[0]}!`);
  }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

async function ensureDemo() { if (!DB.users["maria@oldhealthy.app"]) { DB.users["maria@oldhealthy.app"] = await demoUser(); save(); } }

  navigator.serviceWorker.register("sw.js").catch(() => {});
}
setInterval(() => { tick(); if (S.view === "home" && !$("#overlay")) { /* mantém contadores atualizados */ const y = window.scrollY; render(); window.scrollTo(0, y); } }, 30000);
})();
